<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}

body{background:#f8fafc;color:#0f172a}
.cu75{height:100vh;padding:21px;gap:19px;background:radial-gradient(circle at 25% 6%, #bae6fd66, transparent 28%), linear-gradient(#e0f2fe55 1px, transparent 1px), linear-gradient(90deg, #e0f2fe55 1px, transparent 1px);background-size:auto,39px 39px,39px 39px}
.cu75 > *{min-width:0}
.cu75-hero,.cu75-visual,.cu75-meters,.cu75-board,.cu75-log,.cu75-nav{border:2px solid #0f172a;border-radius:23px;background:#ffffff;box-shadow:6px 6px 0 #0f172a;overflow:hidden}
.cu75-hero{padding:24px}.cu75-hero p{margin:0;color:#0ea5e9;font-weight:950;letter-spacing:.06em}.cu75-hero h1{margin:10px 0 6px;font-size:37px;line-height:.98;letter-spacing:-.055em}.cu75-hero strong{display:block;color:#0f172a;opacity:.72}

.cu75-meters{padding:16px;display:grid;gap:12px;align-content:start}.cu75-meter{border:1px solid #bae6fd;border-radius:16px;padding:13px}.cu75-meter span{display:block;font-size:12px;color:#0f172a;opacity:.72}.cu75-meter b{font-size:26px}.cu75-meter i{display:block;width:var(--w);height:8px;border-radius:99px;background:#0ea5e9;margin-top:8px}
.cu75-board{padding:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-content:start}.cu75-board article{border:1px solid #bae6fd;border-radius:16px;background:#f8fafc;padding:13px;min-height:89px}.cu75-board b{display:block;font-size:13px}.cu75-board span{display:block;margin-top:10px;color:#0f172a;opacity:.65;font-size:12px}.cu75-board em{display:block;margin-top:12px;color:#0ea5e9;font-style:normal;font-weight:950}
.cu75-visual{position:relative;padding:18px}.cu75-log{background:#0f172a;color:#bae6fd;padding:16px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.75}
.screen-a{display:grid;grid-template-columns:250px 1fr 310px;grid-template-rows:170px 1fr 220px}.screen-a .cu75-nav{grid-row:1/4}.screen-a .cu75-hero{grid-column:2}.screen-a .cu75-visual{grid-column:2;grid-row:2/4}.screen-a .cu75-meters{grid-column:3;grid-row:1/3}.screen-a .cu75-board{grid-column:3;grid-row:3}.screen-a .cu75-log{display:none}
.screen-b{display:grid;grid-template-columns:1.2fr .8fr 310px;grid-template-rows:180px 1fr 72px}.screen-b .cu75-hero{grid-column:1}.screen-b .cu75-meters{grid-column:2}.screen-b .cu75-visual{grid-column:1/3;grid-row:2}.screen-b .cu75-nav{grid-column:1/3;grid-row:3;grid-auto-flow:column}.screen-b .cu75-board{grid-column:3;grid-row:1/3}.screen-b .cu75-log{grid-column:3;grid-row:3}
.screen-c{display:grid;grid-template-columns:1fr 330px;grid-template-rows:150px 72px 1fr 180px}.screen-c .cu75-visual{grid-column:1;grid-row:1/5}.screen-c .cu75-hero{grid-column:2;grid-row:1}.screen-c .cu75-nav{grid-column:2;grid-row:2;grid-auto-flow:column}.screen-c .cu75-board{grid-column:2;grid-row:3}.screen-c .cu75-meters{grid-column:2;grid-row:4}.screen-c .cu75-log{display:none}
.screen-d{display:grid;grid-template-columns:220px 1fr;grid-template-rows:1fr 210px}.screen-d .cu75-nav{grid-row:1/3}.screen-d .cu75-board{grid-column:2;grid-row:1}.screen-d .cu75-hero{position:absolute;left:268px;top:38px;width:430px;z-index:2}.screen-d .cu75-visual{grid-column:2;grid-row:1;clip-path:polygon(18% 0,100% 0,100% 100%,0 100%,0 22%)}.screen-d .cu75-meters{grid-column:2;grid-row:2}.screen-d .cu75-log{display:none}
.screen-e{display:grid;grid-template-columns:380px 1fr 280px;grid-template-rows:1fr 210px 72px}.screen-e .cu75-hero{grid-row:1}.screen-e .cu75-visual{grid-column:2;grid-row:1/4}.screen-e .cu75-log{grid-column:3;grid-row:1/3}.screen-e .cu75-board{grid-column:1;grid-row:2}.screen-e .cu75-nav{grid-column:1;grid-row:3;grid-auto-flow:column}.screen-e .cu75-meters{grid-column:3;grid-row:3}

.cu75-asset{position:absolute;inset:0;background:#0f172a;overflow:hidden}.cu75-asset i{position:absolute;left:var(--x);top:var(--y);width:57px;height:37px;border-radius:13px;background:#0ea5e9;opacity:.72}.cu75-asset i.sel{background:#bae6fd;box-shadow:0 0 0 10px #bae6fd33}.cu75-asset b{position:absolute;left:26px;bottom:24px;background:#ffffff;color:#0f172a;border-radius:999px;padding:12px 15px}

.cu75-supply{width:100%;height:100%;background:#f8fafc}.cu75-supply path{fill:none;stroke:#0ea5e9;stroke-width:10;stroke-dasharray:14 10}.cu75-supply circle{fill:#ffffff;stroke:#0f172a;stroke-width:5}.cu75-supply text{text-anchor:middle;dominant-baseline:middle;font-size:11px;font-weight:950;fill:#0f172a}
.cu75-trading{height:100%;display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.cu75-trading article{position:relative;border:1px solid #bae6fd;border-radius:16px;background:#f8fafc;padding:12px}.cu75-trading small{font-weight:950;color:#0ea5e9}.cu75-trading b{display:block;font-size:22px;margin-top:8px}.cu75-trading i{position:absolute;left:12px;right:12px;bottom:10px;border-radius:10px;background:linear-gradient(180deg,#bae6fd,#0ea5e9)}
.cu75-stars{width:100%;height:100%;background:#0f172a;border-radius:18px}.cu75-stars line{stroke:#bae6fd;stroke-width:1;opacity:.45}.cu75-stars circle{fill:#bae6fd}.cu75-stars circle.hot{fill:#0ea5e9}.cu75-stars text{fill:#ffffff;font-weight:950;font-size:24px}
.cu75-document{height:100%;display:grid;grid-template-columns:1fr 280px;gap:18px}.cu75-document section,.cu75-document aside{border:1px solid #bae6fd;border-radius:18px;background:#f8fafc;padding:22px}.cu75-document p{height:13px;border-radius:99px;background:#bae6fd;margin:0 0 16px}.cu75-document p.mark{background:#0ea5e9;box-shadow:0 0 0 8px #bae6fd77}.cu75-document b{display:block;border-bottom:1px solid #bae6fd;padding:14px 0;color:#0ea5e9}
.cu75-voice{height:100%;display:grid;grid-template-columns:1fr 320px;gap:18px}.cu75-voice>div{display:flex;align-items:center;gap:7px}.cu75-voice i{flex:1;border-radius:99px;background:#0ea5e9}.cu75-voice aside{border:1px solid #bae6fd;border-radius:18px;background:#f8fafc;padding:16px}.cu75-voice p{border-bottom:1px solid #bae6fd;padding-bottom:12px}.cu75-voice b,.cu75-voice span{display:block}
.cu75-factory{height:100%;display:grid;grid-template-columns:repeat(8,1fr);gap:9px}.cu75-factory i{border-radius:10px;background:#e0f2fe;border:1px solid #bae6fd}.cu75-factory i.warn{background:#f59e0b}.cu75-factory i.bad{background:#ef4444;box-shadow:0 0 0 5px #fecaca}
.cu75-people-graph{position:absolute;inset:0;background:#ffffff}.cu75-people-graph section{position:absolute;left:var(--x);top:var(--y);min-width:96px;border:2px solid #0f172a;border-radius:999px;background:#f8fafc;padding:10px 12px;text-align:center}.cu75-people-graph b{display:block;font-size:12px}.cu75-people-graph span{color:#0ea5e9;font-weight:950}.cu75-people-graph i{position:absolute;left:50%;top:50%;width:var(--l);height:2px;background:#bae6fd;transform:rotate(var(--r));transform-origin:left center}
.cu75-control{height:100%;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.cu75-control article{border:1px solid #bae6fd;border-radius:16px;background:#f8fafc;padding:14px}.cu75-control b,.cu75-control span{display:block}

</style>

<script>


const cu75Live=[...document.querySelectorAll("[data-live]")];
let cu75Frame=0;
setInterval(()=>{cu75Frame++;cu75Live.forEach((el,i)=>{el.textContent=(58+((cu75Frame*3+i*7+75)%39))+"%";});},1200);

const cu75Log=document.getElementById("cu75log");
if(cu75Log){
  const rows=["설비 편차","불량 픽셀","라인 병목","정비 우선순위","작업지시","정비 티켓","라인 알림","품질 리포트","MES 로그","센서 스트림","검사 이미지","작업지시서"];
  let idx=0;
  setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+rows[idx++%rows.length]+" synced";cu75Log.prepend(p);while(cu75Log.children.length>18)cu75Log.lastElementChild.remove();},700);
}

</script>
