.cu68-document{height:100%;display:grid;grid-template-columns:1fr 280px;gap:18px}.cu68-document section,.cu68-document aside{border:1px solid #fed7aa;border-radius:18px;background:#f7f2ea;padding:22px}.cu68-document p{height:13px;border-radius:99px;background:#fed7aa;margin:0 0 16px}.cu68-document p.mark{background:#b45309;box-shadow:0 0 0 8px #fed7aa77}.cu68-document b{display:block;border-bottom:1px solid #fed7aa;padding:14px 0;color:#b45309}

        </svg></section><section class="cu68-board"><article><b>SKU-068-0</b><span>발주량 추천</span><em data-live>87%</em></article><article><b>센터-068-1</b><span>노출 변경</span><em data-live>59%</em></article><article><b>노선-068-2</b><span>배차 추천</span><em data-live>70%</em></article><article><b>발주-068-3</b><span>지연 알림</span><em data-live>81%</em></article><article><b>SKU-068-4</b><span>품절 예상시점</span><em data-live>92%</em></article><article><b>센터-068-5</b><span>과재고 지수</span><em data-live>64%</em></article><article><b>노선-068-6</b><span>센터 이동량</span><em data-live>75%</em></article><article><b>발주-068-7</b><span>대체 SKU</span><em data-live>86%</em></article><article><b>SKU-068-8</b><span>발주량 추천</span><em data-live>58%</em></article></section><aside class="cu68-log" id="cu68log"></aside></main>
<script>


const cu68Live=[...document.querySelectorAll("[data-live]")];
let cu68Frame=0;
setInterval(()=>{cu68Frame++;cu68Live.forEach((el,i)=>{el.textContent=(58+((cu68Frame*3+i*7+68)%39))+"%";});},1200);

const cu68Log=document.getElementById("cu68log");
if(cu68Log){
  const rows=["품절 예상시점","과재고 지수","센터 이동량","대체 SKU","발주량 추천","노출 변경","배차 추천","지연 알림","주문 로그","센터 재고","배송 SLA","프로모션"];
  let idx=0;
  setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+rows[idx++%rows.length]+" synced";cu68Log.prepend(p);while(cu68Log.children.length>18)cu68Log.lastElementChild.remove();},700);
}

</script>
