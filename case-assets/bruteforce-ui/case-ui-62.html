<script>


const cu62Live=[...document.querySelectorAll("[data-live]")];
let cu62Frame=0;
setInterval(()=>{cu62Frame++;cu62Live.forEach((el,i)=>{el.textContent=(58+((cu62Frame*3+i*7+62)%39))+"%";});},1200);

const cu62Log=document.getElementById("cu62log");
if(cu62Log){
  const rows=["설비 편차","불량 픽셀","라인 병목","정비 우선순위","작업지시","정비 티켓","라인 알림","품질 리포트","MES 로그","센서 스트림","검사 이미지","작업지시서"];
  let idx=0;
  setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+rows[idx++%rows.length]+" synced";cu62Log.prepend(p);while(cu62Log.children.length>18)cu62Log.lastElementChild.remove();},700);
}

</script>
