<script>


const cu11Live=[...document.querySelectorAll("[data-live]")];
let cu11Frame=0;
setInterval(()=>{cu11Frame++;cu11Live.forEach((el,i)=>{el.textContent=(58+((cu11Frame*3+i*7+11)%39))+"%";});},1200);

const cu11Log=document.getElementById("cu11log");
if(cu11Log){
  const rows=["품절 예상시점","과재고 지수","센터 이동량","대체 SKU","발주량 추천","노출 변경","배차 추천","지연 알림","주문 로그","센터 재고","배송 SLA","프로모션"];
  let idx=0;
  setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+rows[idx++%rows.length]+" synced";cu11Log.prepend(p);while(cu11Log.children.length>18)cu11Log.lastElementChild.remove();},700);
}

</script>
