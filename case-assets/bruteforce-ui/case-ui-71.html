.cu71-supply{width:100%;height:100%;background:#fff7ed}.cu71-supply path{fill:none;stroke:#f97316;stroke-width:10;stroke-dasharray:14 10}.cu71-supply circle{fill:#ffffff;stroke:#1f2937;stroke-width:5}.cu71-supply text{text-anchor:middle;dominant-baseline:middle;font-size:11px;font-weight:950;fill:#1f2937}

.cu71-document{height:100%;display:grid;grid-template-columns:1fr 280px;gap:18px}.cu71-document section,.cu71-document aside{border:1px solid #ffd3b6;border-radius:18px;background:#fff7ed;padding:22px}.cu71-document p{height:13px;border-radius:99px;background:#ffd3b6;margin:0 0 16px}.cu71-document p.mark{background:#f97316;box-shadow:0 0 0 8px #ffd3b677}.cu71-document b{display:block;border-bottom:1px solid #ffd3b6;padding:14px 0;color:#f97316}
.cu71-voice{height:100%;display:grid;grid-template-columns:1fr 320px;gap:18px}.cu71-voice>div{display:flex;align-items:center;gap:7px}.cu71-voice i{flex:1;border-radius:99px;background:#f97316}.cu71-voice aside{border:1px solid #ffd3b6;border-radius:18px;background:#fff7ed;padding:16px}.cu71-voice p{border-bottom:1px solid #ffd3b6;padding-bottom:12px}.cu71-voice b,.cu71-voice span{display:block}
.cu71-factory{height:100%;display:grid;grid-template-columns:repeat(9,1fr);gap:9px}.cu71-factory i{border-radius:10px;background:#ffedd5;border:1px solid #ffd3b6}.cu71-factory i.warn{background:#f59e0b}.cu71-factory i.bad{background:#ef4444;box-shadow:0 0 0 5px #fecaca}
.cu71-people-graph{position:absolute;inset:0;background:#ffffff}.cu71-people-graph section{position:absolute;left:var(--x);top:var(--y);min-width:96px;border:2px solid #1f2937;border-radius:999px;background:#fff7ed;padding:10px 12px;text-align:center}.cu71-people-graph b{display:block;font-size:12px}.cu71-people-graph span{color:#f97316;font-weight:950}.cu71-people-graph i{position:absolute;left:50%;top:50%;width:var(--l);height:2px;background:#ffd3b6;transform:rotate(var(--r));transform-origin:left center}
.cu71-control{height:100%;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.cu71-control article{border:1px solid #ffd3b6;border-radius:16px;background:#fff7ed;padding:14px}.cu71-control b,.cu71-control span{display:block}

<script>


const cu71Live=[...document.querySelectorAll("[data-live]")];
let cu71Frame=0;
setInterval(()=>{cu71Frame++;cu71Live.forEach((el,i)=>{el.textContent=(58+((cu71Frame*3+i*7+71)%39))+"%";});},1200);

const cu71Log=document.getElementById("cu71log");
if(cu71Log){
  const rows=["품절 예상시점","과재고 지수","센터 이동량","대체 SKU","발주량 추천","노출 변경","배차 추천","지연 알림","주문 로그","센터 재고","배송 SLA","프로모션"];
  let idx=0;
  setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+rows[idx++%rows.length]+" synced";cu71Log.prepend(p);while(cu71Log.children.length>18)cu71Log.lastElementChild.remove();},700);
}

</script>
