<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>case-ui-85 | 회계 증빙 검수</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}

body{background:#f8fafc;color:#0f172a}
.cu85{height:100vh;padding:22px;gap:15px;background:radial-gradient(circle at 32% 87%, #bae6fd66, transparent 28%), linear-gradient(#e0f2fe55 1px, transparent 1px), linear-gradient(90deg, #e0f2fe55 1px, transparent 1px);background-size:auto,35px 35px,35px 35px}
.cu85 > *{min-width:0}
.cu85-hero,.cu85-visual,.cu85-meters,.cu85-board,.cu85-log,.cu85-nav{border:2px solid #0f172a;border-radius:19px;background:#ffffff;box-shadow:6px 6px 0 #0f172a;overflow:hidden}
.cu85-hero{padding:24px}.cu85-hero p{margin:0;color:#0ea5e9;font-weight:950;letter-spacing:.06em}.cu85-hero h1{margin:10px 0 6px;font-size:47px;line-height:.98;letter-spacing:-.055em}.cu85-hero strong{display:block;color:#0f172a;opacity:.72}
.cu85-nav{padding:13px;display:grid;gap:10px;align-content:start}.cu85-nav span{border:1px solid #bae6fd;border-radius:14px;background:#f8fafc;padding:12px;font-weight:950;font-size:13px}.cu85-nav span.on{background:#0f172a;color:#ffffff}
.cu85-meters{padding:16px;display:grid;gap:12px;align-content:start}.cu85-meter{border:1px solid #bae6fd;border-radius:16px;padding:13px}.cu85-meter span{display:block;font-size:12px;color:#0f172a;opacity:.72}.cu85-meter b{font-size:26px}.cu85-meter i{display:block;width:var(--w);height:8px;border-radius:99px;background:#0ea5e9;margin-top:8px}
.cu85-board{padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start}.cu85-board article{border:1px solid #bae6fd;border-radius:16px;background:#f8fafc;padding:13px;min-height:99px}.cu85-board b{display:block;font-size:13px}.cu85-board span{display:block;margin-top:10px;color:#0f172a;opacity:.65;font-size:12px}.cu85-board em{display:block;margin-top:12px;color:#0ea5e9;font-style:normal;font-weight:950}
.cu85-visual{position:relative;padding:18px}.cu85-log{background:#0f172a;color:#bae6fd;padding:16px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.75}
.screen-a{display:grid;grid-template-columns:250px 1fr 310px;grid-template-rows:170px 1fr 220px}.screen-a .cu85-nav{grid-row:1/4}.screen-a .cu85-hero{grid-column:2}.screen-a .cu85-visual{grid-column:2;grid-row:2/4}.screen-a .cu85-meters{grid-column:3;grid-row:1/3}.screen-a .cu85-board{grid-column:3;grid-row:3}.screen-a .cu85-log{display:none}
.screen-b{display:grid;grid-template-columns:1.2fr .8fr 310px;grid-template-rows:180px 1fr 72px}.screen-b .cu85-hero{grid-column:1}.screen-b .cu85-meters{grid-column:2}.screen-b .cu85-visual{grid-column:1/3;grid-row:2}.screen-b .cu85-nav{grid-column:1/3;grid-row:3;grid-auto-flow:column}.screen-b .cu85-board{grid-column:3;grid-row:1/3}.screen-b .cu85-log{grid-column:3;grid-row:3}
.screen-c{display:grid;grid-template-columns:1fr 330px;grid-template-rows:150px 72px 1fr 180px}.screen-c .cu85-visual{grid-column:1;grid-row:1/5}.screen-c .cu85-hero{grid-column:2;grid-row:1}.screen-c .cu85-nav{grid-column:2;grid-row:2;grid-auto-flow:column}.screen-c .cu85-board{grid-column:2;grid-row:3}.screen-c .cu85-meters{grid-column:2;grid-row:4}.screen-c .cu85-log{display:none}
.screen-d{display:grid;grid-template-columns:220px 1fr;grid-template-rows:1fr 210px}.screen-d .cu85-nav{grid-row:1/3}.screen-d .cu85-board{grid-column:2;grid-row:1}.screen-d .cu85-hero{position:absolute;left:268px;top:38px;width:430px;z-index:2}.screen-d .cu85-visual{grid-column:2;grid-row:1;clip-path:polygon(18% 0,100% 0,100% 100%,0 100%,0 22%)}.screen-d .cu85-meters{grid-column:2;grid-row:2}.screen-d .cu85-log{display:none}
.screen-e{display:grid;grid-template-columns:380px 1fr 280px;grid-template-rows:1fr 210px 72px}.screen-e .cu85-hero{grid-row:1}.screen-e .cu85-visual{grid-column:2;grid-row:1/4}.screen-e .cu85-log{grid-column:3;grid-row:1/3}.screen-e .cu85-board{grid-column:1;grid-row:2}.screen-e .cu85-nav{grid-column:1;grid-row:3;grid-auto-flow:column}.screen-e .cu85-meters{grid-column:3;grid-row:3}
.screen-f{display:grid;grid-template-columns:300px 1fr;grid-template-rows:145px 66px 1fr}.screen-f .cu85-meters{grid-column:1;grid-row:1/4}.screen-f .cu85-hero{grid-column:2;grid-row:1}.screen-f .cu85-nav{grid-column:2;grid-row:2;grid-auto-flow:column}.screen-f .cu85-visual{grid-column:2;grid-row:3}.screen-f .cu85-board{position:absolute;right:36px;bottom:36px;width:520px;max-height:220px}.screen-f .cu85-log{display:none}
.screen-g{display:grid;grid-template-columns:320px 1fr 310px;grid-template-rows:150px 1fr}.screen-g .cu85-log{grid-row:1/3}.screen-g .cu85-hero{grid-column:2}.screen-g .cu85-visual{grid-column:2;grid-row:2}.screen-g .cu85-board{grid-column:3;grid-row:1}.screen-g .cu85-meters{grid-column:3;grid-row:2}.screen-g .cu85-nav{display:none}
.cu85-asset{position:absolute;inset:0;background:#0f172a;overflow:hidden}.cu85-asset i{position:absolute;left:var(--x);top:var(--y);width:39px;height:47px;border-radius:9px;background:#0ea5e9;opacity:.72}.cu85-asset i.sel{background:#bae6fd;box-shadow:0 0 0 10px #bae6fd33}.cu85-asset b{position:absolute;left:26px;bottom:24px;background:#ffffff;color:#0f172a;border-radius:999px;padding:12px 15px}
.cu85-radar{width:100%;height:100%}.cu85-radar circle{fill:none;stroke:#bae6fd;stroke-width:3}.cu85-radar rect{fill:#ffffff;stroke:#0f172a;stroke-width:3}.cu85-radar text{text-anchor:middle;dominant-baseline:middle;font-size:11px;font-weight:950;fill:#0f172a}
.cu85-supply{width:100%;height:100%;background:#f8fafc}.cu85-supply path{fill:none;stroke:#0ea5e9;stroke-width:10;stroke-dasharray:14 10}.cu85-supply circle{fill:#ffffff;stroke:#0f172a;stroke-width:5}.cu85-supply text{text-anchor:middle;dominant-baseline:middle;font-size:11px;font-weight:950;fill:#0f172a}
.cu85-trading{height:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.cu85-trading article{position:relative;border:1px solid #bae6fd;border-radius:16px;background:#f8fafc;padding:12px}.cu85-trading small{font-weight:950;color:#0ea5e9}.cu85-trading b{display:block;font-size:22px;margin-top:8px}.cu85-trading i{position:absolute;left:12px;right:12px;bottom:10px;border-radius:10px;background:linear-gradient(180deg,#bae6fd,#0ea5e9)}
.cu85-stars{width:100%;height:100%;background:#0f172a;border-radius:18px}.cu85-stars line{stroke:#bae6fd;stroke-width:1;opacity:.45}.cu85-stars circle{fill:#bae6fd}.cu85-stars circle.hot{fill:#0ea5e9}.cu85-stars text{fill:#ffffff;font-weight:950;font-size:24px}
.cu85-document{height:100%;display:grid;grid-template-columns:1fr 280px;gap:18px}.cu85-document section,.cu85-document aside{border:1px solid #bae6fd;border-radius:18px;background:#f8fafc;padding:22px}.cu85-document p{height:13px;border-radius:99px;background:#bae6fd;margin:0 0 16px}.cu85-document p.mark{background:#0ea5e9;box-shadow:0 0 0 8px #bae6fd77}.cu85-document b{display:block;border-bottom:1px solid #bae6fd;padding:14px 0;color:#0ea5e9}
.cu85-voice{height:100%;display:grid;grid-template-columns:1fr 320px;gap:18px}.cu85-voice>div{display:flex;align-items:center;gap:7px}.cu85-voice i{flex:1;border-radius:99px;background:#0ea5e9}.cu85-voice aside{border:1px solid #bae6fd;border-radius:18px;background:#f8fafc;padding:16px}.cu85-voice p{border-bottom:1px solid #bae6fd;padding-bottom:12px}.cu85-voice b,.cu85-voice span{display:block}
.cu85-factory{height:100%;display:grid;grid-template-columns:repeat(8,1fr);gap:9px}.cu85-factory i{border-radius:10px;background:#e0f2fe;border:1px solid #bae6fd}.cu85-factory i.warn{background:#f59e0b}.cu85-factory i.bad{background:#ef4444;box-shadow:0 0 0 5px #fecaca}
.cu85-people-graph{position:absolute;inset:0;background:#ffffff}.cu85-people-graph section{position:absolute;left:var(--x);top:var(--y);min-width:96px;border:2px solid #0f172a;border-radius:999px;background:#f8fafc;padding:10px 12px;text-align:center}.cu85-people-graph b{display:block;font-size:12px}.cu85-people-graph span{color:#0ea5e9;font-weight:950}.cu85-people-graph i{position:absolute;left:50%;top:50%;width:var(--l);height:2px;background:#bae6fd;transform:rotate(var(--r));transform-origin:left center}
.cu85-control{height:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cu85-control article{border:1px solid #bae6fd;border-radius:16px;background:#f8fafc;padding:14px}.cu85-control b,.cu85-control span{display:block}

</style>
</head>
<body>
<main class="cu85 screen-b"><div class="cu85-hero"><p>Orbit Finance · CASE 085</p><h1>Document Risk Workbench</h1><strong>회계 증빙 검수</strong></div><div class="cu85-meters"><article class="cu85-meter"><span>금액 불일치</span><b data-live>78%</b><i style="--w:78%"></i></article><article class="cu85-meter"><span>권한 예외</span><b data-live>87%</b><i style="--w:87%"></i></article><article class="cu85-meter"><span>검토 위험도</span><b data-live>96%</b><i style="--w:96%"></i></article><article class="cu85-meter"><span>PDF 원본</span><b data-live>68%</b><i style="--w:68%"></i></article></div><section class="cu85-visual"><div class="cu85-document">
            <section><p class="" style="width:92%"></p><p class="mark" style="width:85%"></p><p class="" style="width:78%"></p><p class="" style="width:71%"></p><p class="" style="width:64%"></p><p class="mark" style="width:57%"></p><p class="" style="width:92%"></p><p class="" style="width:85%"></p><p class="" style="width:78%"></p><p class="mark" style="width:71%"></p><p class="" style="width:64%"></p><p class="" style="width:57%"></p><p class="" style="width:92%"></p></section>
            <aside><b>01 핵심 조항</b><b>02 금액 불일치</b><b>03 권한 예외</b><b>04 검토 위험도</b></aside>
        </div></section><nav class="cu85-nav"><span class="on">PDF 원본</span><span class="">거래처 원장</span><span class="">승인 이력</span><span class="">표준 조항집</span><span class="">조항 추출</span></nav><section class="cu85-board"><article><b>문서-085-0</b><span>검토자 지정</span><em data-live>65%</em></article><article><b>조항-085-1</b><span>반려 사유</span><em data-live>76%</em></article><article><b>금액-085-2</b><span>승인 큐</span><em data-live>87%</em></article><article><b>거래처-085-3</b><span>핵심 조항</span><em data-live>59%</em></article><article><b>문서-085-4</b><span>금액 불일치</span><em data-live>70%</em></article><article><b>조항-085-5</b><span>권한 예외</span><em data-live>81%</em></article></section><aside class="cu85-log" id="cu85log"></aside></main>
<script>


const cu85Live=[...document.querySelectorAll("[data-live]")];
let cu85Frame=0;
setInterval(()=>{cu85Frame++;cu85Live.forEach((el,i)=>{el.textContent=(58+((cu85Frame*3+i*7+85)%39))+"%";});},1200);

const cu85Log=document.getElementById("cu85log");
if(cu85Log){
  const rows=["핵심 조항","금액 불일치","권한 예외","검토 위험도","조항 추출","검토자 지정","반려 사유","승인 큐","PDF 원본","거래처 원장","승인 이력","표준 조항집"];
  let idx=0;
  setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+rows[idx++%rows.length]+" synced";cu85Log.prepend(p);while(cu85Log.children.length>18)cu85Log.lastElementChild.remove();},700);
}

</script>
</body>
</html>
