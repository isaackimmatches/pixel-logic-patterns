.cu90-people-graph{position:absolute;inset:0;background:#ffffff}.cu90-people-graph section{position:absolute;left:var(--x);top:var(--y);min-width:96px;border:2px solid #101828;border-radius:999px;background:#f7fbff;padding:10px 12px;text-align:center}.cu90-people-graph b{display:block;font-size:12px}.cu90-people-graph span{color:#2563eb;font-weight:950}.cu90-people-graph i{position:absolute;left:50%;top:50%;width:var(--l);height:2px;background:#9bd4ff;transform:rotate(var(--r));transform-origin:left center}

const cu90Live=[...document.querySelectorAll("[data-live]")];
let cu90Frame=0;

}
