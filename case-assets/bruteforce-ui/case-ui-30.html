<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}

body{background:#f7fbff;color:#101828}
.cu30{height:100vh;padding:21px;gap:16px;background:radial-gradient(circle at 79% 45%, #9bd4ff66, transparent 28%), linear-gradient(#dbeafe55 1px, transparent 1px), linear-gradient(90deg, #dbeafe55 1px, transparent 1px);background-size:auto,36px 36px,36px 36px}

.cu30-hero{padding:24px}.cu30-hero p{margin:0;color:#2563eb;font-weight:950;letter-spacing:.06em}.cu30-hero h1{margin:10px 0 6px;font-size:46px;line-height:.98;letter-spacing:-.055em}.cu30-hero strong{display:block;color:#101828;opacity:.72}

.cu30-board{padding:16px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-content:start}.cu30-board article{border:1px solid #9bd4ff;border-radius:16px;background:#f7fbff;padding:13px;min-height:112px}.cu30-board b{display:block;font-size:13px}.cu30-board span{display:block;margin-top:10px;color:#101828;opacity:.65;font-size:12px}.cu30-board em{display:block;margin-top:12px;color:#2563eb;font-style:normal;font-weight:950}
.cu30-visual{position:relative;padding:18px}.cu30-log{background:#101828;color:#9bd4ff;padding:16px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.75}
.screen-a{display:grid;grid-template-columns:250px 1fr 310px;grid-template-rows:170px 1fr 220px}.screen-a .cu30-nav{grid-row:1/4}.screen-a .cu30-hero{grid-column:2}.screen-a .cu30-visual{grid-column:2;grid-row:2/4}.screen-a .cu30-meters{grid-column:3;grid-row:1/3}.screen-a .cu30-board{grid-column:3;grid-row:3}.screen-a .cu30-log{display:none}
.screen-b{display:grid;grid-template-columns:1.2fr .8fr 310px;grid-template-rows:180px 1fr 72px}.screen-b .cu30-hero{grid-column:1}.screen-b .cu30-meters{grid-column:2}.screen-b .cu30-visual{grid-column:1/3;grid-row:2}.screen-b .cu30-nav{grid-column:1/3;grid-row:3;grid-auto-flow:column}.screen-b .cu30-board{grid-column:3;grid-row:1/3}.screen-b .cu30-log{grid-column:3;grid-row:3}
.screen-c{display:grid;grid-template-columns:1fr 330px;grid-template-rows:150px 72px 1fr 180px}.screen-c .cu30-visual{grid-column:1;grid-row:1/5}.screen-c .cu30-hero{grid-column:2;grid-row:1}.screen-c .cu30-nav{grid-column:2;grid-row:2;grid-auto-flow:column}.screen-c .cu30-board{grid-column:2;grid-row:3}.screen-c .cu30-meters{grid-column:2;grid-row:4}.screen-c .cu30-log{display:none}
.screen-d{display:grid;grid-template-columns:220px 1fr;grid-template-rows:1fr 210px}.screen-d .cu30-nav{grid-row:1/3}.screen-d .cu30-board{grid-column:2;grid-row:1}.screen-d .cu30-hero{position:absolute;left:268px;top:38px;width:430px;z-index:2}.screen-d .cu30-visual{grid-column:2;grid-row:1;clip-path:polygon(18% 0,100% 0,100% 100%,0 100%,0 22%)}.screen-d .cu30-meters{grid-column:2;grid-row:2}.screen-d .cu30-log{display:none}
.screen-e{display:grid;grid-template-columns:380px 1fr 280px;grid-template-rows:1fr 210px 72px}.screen-e .cu30-hero{grid-row:1}.screen-e .cu30-visual{grid-column:2;grid-row:1/4}.screen-e .cu30-log{grid-column:3;grid-row:1/3}.screen-e .cu30-board{grid-column:1;grid-row:2}.screen-e .cu30-nav{grid-column:1;grid-row:3;grid-auto-flow:column}.screen-e .cu30-meters{grid-column:3;grid-row:3}
.screen-f{display:grid;grid-template-columns:300px 1fr;grid-template-rows:145px 66px 1fr}.screen-f .cu30-meters{grid-column:1;grid-row:1/4}.screen-f .cu30-hero{grid-column:2;grid-row:1}.screen-f .cu30-nav{grid-column:2;grid-row:2;grid-auto-flow:column}.screen-f .cu30-visual{grid-column:2;grid-row:3}.screen-f .cu30-board{position:absolute;right:36px;bottom:36px;width:520px;max-height:220px}.screen-f .cu30-log{display:none}
.screen-g{display:grid;grid-template-columns:320px 1fr 310px;grid-template-rows:150px 1fr}.screen-g .cu30-log{grid-row:1/3}.screen-g .cu30-hero{grid-column:2}.screen-g .cu30-visual{grid-column:2;grid-row:2}.screen-g .cu30-board{grid-column:3;grid-row:1}.screen-g .cu30-meters{grid-column:3;grid-row:2}.screen-g .cu30-nav{display:none}
.cu30-asset{position:absolute;inset:0;background:#101828;overflow:hidden}.cu30-asset i{position:absolute;left:var(--x);top:var(--y);width:40px;height:40px;border-radius:10px;background:#2563eb;opacity:.72}.cu30-asset i.sel{background:#9bd4ff;box-shadow:0 0 0 10px #9bd4ff33}.cu30-asset b{position:absolute;left:26px;bottom:24px;background:#ffffff;color:#101828;border-radius:999px;padding:12px 15px}
.cu30-radar{width:100%;height:100%}.cu30-radar circle{fill:none;stroke:#9bd4ff;stroke-width:3}.cu30-radar rect{fill:#ffffff;stroke:#101828;stroke-width:3}.cu30-radar text{text-anchor:middle;dominant-baseline:middle;font-size:11px;font-weight:950;fill:#101828}
.cu30-supply{width:100%;height:100%;background:#f7fbff}.cu30-supply path{fill:none;stroke:#2563eb;stroke-width:10;stroke-dasharray:14 10}.cu30-supply circle{fill:#ffffff;stroke:#101828;stroke-width:5}.cu30-supply text{text-anchor:middle;dominant-baseline:middle;font-size:11px;font-weight:950;fill:#101828}
.cu30-trading{height:100%;display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.cu30-trading article{position:relative;border:1px solid #9bd4ff;border-radius:16px;background:#f7fbff;padding:12px}.cu30-trading small{font-weight:950;color:#2563eb}.cu30-trading b{display:block;font-size:22px;margin-top:8px}.cu30-trading i{position:absolute;left:12px;right:12px;bottom:10px;border-radius:10px;background:linear-gradient(180deg,#9bd4ff,#2563eb)}
.cu30-stars{width:100%;height:100%;background:#101828;border-radius:18px}.cu30-stars line{stroke:#9bd4ff;stroke-width:1;opacity:.45}.cu30-stars circle{fill:#9bd4ff}.cu30-stars circle.hot{fill:#2563eb}.cu30-stars text{fill:#ffffff;font-weight:950;font-size:24px}
.cu30-document{height:100%;display:grid;grid-template-columns:1fr 280px;gap:18px}.cu30-document section,.cu30-document aside{border:1px solid #9bd4ff;border-radius:18px;background:#f7fbff;padding:22px}.cu30-document p{height:13px;border-radius:99px;background:#9bd4ff;margin:0 0 16px}.cu30-document p.mark{background:#2563eb;box-shadow:0 0 0 8px #9bd4ff77}.cu30-document b{display:block;border-bottom:1px solid #9bd4ff;padding:14px 0;color:#2563eb}
.cu30-voice{height:100%;display:grid;grid-template-columns:1fr 320px;gap:18px}.cu30-voice>div{display:flex;align-items:center;gap:7px}.cu30-voice i{flex:1;border-radius:99px;background:#2563eb}.cu30-voice aside{border:1px solid #9bd4ff;border-radius:18px;background:#f7fbff;padding:16px}.cu30-voice p{border-bottom:1px solid #9bd4ff;padding-bottom:12px}.cu30-voice b,.cu30-voice span{display:block}
.cu30-factory{height:100%;display:grid;grid-template-columns:repeat(8,1fr);gap:9px}.cu30-factory i{border-radius:10px;background:#dbeafe;border:1px solid #9bd4ff}.cu30-factory i.warn{background:#f59e0b}.cu30-factory i.bad{background:#ef4444;box-shadow:0 0 0 5px #fecaca}
.cu30-people-graph{position:absolute;inset:0;background:#ffffff}.cu30-people-graph section{position:absolute;left:var(--x);top:var(--y);min-width:96px;border:2px solid #101828;border-radius:999px;background:#f7fbff;padding:10px 12px;text-align:center}.cu30-people-graph b{display:block;font-size:12px}.cu30-people-graph span{color:#2563eb;font-weight:950}.cu30-people-graph i{position:absolute;left:50%;top:50%;width:var(--l);height:2px;background:#9bd4ff;transform:rotate(var(--r));transform-origin:left center}
.cu30-control{height:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.cu30-control article{border:1px solid #9bd4ff;border-radius:16px;background:#f7fbff;padding:14px}.cu30-control b,.cu30-control span{display:block}

</style>

        </svg></section><div class="cu30-hero"><p>Verse Logistics · CASE 030</p><h1>Inventory Motion Planner</h1><strong>온·오프라인 재고 통합</strong></div><nav class="cu30-nav"><span class="on">주문 로그</span><span class="">센터 재고</span><span class="">배송 SLA</span><span class="">프로모션</span><span class="">발주량 추천</span></nav><section class="cu30-board"><article><b>SKU-030-0</b><span>배차 추천</span><em data-live>88%</em></article><article><b>센터-030-1</b><span>지연 알림</span><em data-live>60%</em></article><article><b>노선-030-2</b><span>품절 예상시점</span><em data-live>71%</em></article><article><b>발주-030-3</b><span>과재고 지수</span><em data-live>82%</em></article><article><b>SKU-030-4</b><span>센터 이동량</span><em data-live>93%</em></article><article><b>센터-030-5</b><span>대체 SKU</span><em data-live>65%</em></article></section><div class="cu30-meters"><article class="cu30-meter"><span>배송 SLA</span><b data-live>62%</b><i style="--w:62%"></i></article><article class="cu30-meter"><span>프로모션</span><b data-live>71%</b><i style="--w:71%"></i></article><article class="cu30-meter"><span>발주량 추천</span><b data-live>80%</b><i style="--w:80%"></i></article><article class="cu30-meter"><span>노출 변경</span><b data-live>89%</b><i style="--w:89%"></i></article><article class="cu30-meter"><span>배차 추천</span><b data-live>61%</b><i style="--w:61%"></i></article></div><aside class="cu30-log" id="cu30log"></aside></main>
<script>


const cu30Live=[...document.querySelectorAll("[data-live]")];
let cu30Frame=0;
setInterval(()=>{cu30Frame++;cu30Live.forEach((el,i)=>{el.textContent=(58+((cu30Frame*3+i*7+30)%39))+"%";});},1200);

const cu30Log=document.getElementById("cu30log");
if(cu30Log){
  const rows=["품절 예상시점","과재고 지수","센터 이동량","대체 SKU","발주량 추천","노출 변경","배차 추천","지연 알림","주문 로그","센터 재고","배송 SLA","프로모션"];
  let idx=0;
  setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+rows[idx++%rows.length]+" synced";cu30Log.prepend(p);while(cu30Log.children.length>18)cu30Log.lastElementChild.remove();},700);
}

</script>
