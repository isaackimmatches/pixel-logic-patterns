<script>


const cu25Live=[...document.querySelectorAll("[data-live]")];
let cu25Frame=0;
setInterval(()=>{cu25Frame++;cu25Live.forEach((el,i)=>{el.textContent=(58+((cu25Frame*3+i*7+25)%39))+"%";});},1200);

const cu25Log=document.getElementById("cu25log");
if(cu25Log){
  const rows=["품절 예상시점","과재고 지수","센터 이동량","대체 SKU","발주량 추천","노출 변경","배차 추천","지연 알림","주문 로그","센터 재고","배송 SLA","프로모션"];
  let idx=0;
  setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+rows[idx++%rows.length]+" synced";cu25Log.prepend(p);while(cu25Log.children.length>18)cu25Log.lastElementChild.remove();},700);
}
