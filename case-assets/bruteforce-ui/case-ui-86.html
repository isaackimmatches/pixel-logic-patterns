<script>


const cu86Live=[...document.querySelectorAll("[data-live]")];
let cu86Frame=0;
setInterval(()=>{cu86Frame++;cu86Live.forEach((el,i)=>{el.textContent=(58+((cu86Frame*3+i*7+86)%39))+"%";});},1200);

const cu86Log=document.getElementById("cu86log");
if(cu86Log){
  const rows=["핵심 조항","금액 불일치","권한 예외","검토 위험도","조항 추출","검토자 지정","반려 사유","승인 큐","PDF 원본","거래처 원장","승인 이력","표준 조항집"];
  let idx=0;
  setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+rows[idx++%rows.length]+" synced";cu86Log.prepend(p);while(cu86Log.children.length>18)cu86Log.lastElementChild.remove();},700);
}
