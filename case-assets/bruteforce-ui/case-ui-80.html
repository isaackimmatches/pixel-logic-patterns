.cu80-document{height:100%;display:grid;grid-template-columns:1fr 280px;gap:18px}.cu80-document section,.cu80-document aside{border:1px solid #9bd4ff;border-radius:18px;background:#f7fbff;padding:22px}.cu80-document p{height:13px;border-radius:99px;background:#9bd4ff;margin:0 0 16px}.cu80-document p.mark{background:#2563eb;box-shadow:0 0 0 8px #9bd4ff77}.cu80-document b{display:block;border-bottom:1px solid #9bd4ff;padding:14px 0;color:#2563eb}

.cu80-people-graph{position:absolute;inset:0;background:#ffffff}.cu80-people-graph section{position:absolute;left:var(--x);top:var(--y);min-width:96px;border:2px solid #101828;border-radius:999px;background:#f7fbff;padding:10px 12px;text-align:center}.cu80-people-graph b{display:block;font-size:12px}.cu80-people-graph span{color:#2563eb;font-weight:950}.cu80-people-graph i{position:absolute;left:50%;top:50%;width:var(--l);height:2px;background:#9bd4ff;transform:rotate(var(--r));transform-origin:left center}

<script>


const cu80Live=[...document.querySelectorAll("[data-live]")];
let cu80Frame=0;
setInterval(()=>{cu80Frame++;cu80Live.forEach((el,i)=>{el.textContent=(58+((cu80Frame*3+i*7+80)%39))+"%";});},1200);

const cu80Log=document.getElementById("cu80log");
if(cu80Log){
  const rows=["이탈 위험","권한 이상","응답 지연","리텐션 점수","알림 발송","담당 배정","권한 조정","복구 캠페인","사용자 프로필","활동 로그","결제 이력","권한 변경"];
  let idx=0;
  setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+rows[idx++%rows.length]+" synced";cu80Log.prepend(p);while(cu80Log.children.length>18)cu80Log.lastElementChild.remove();},700);
}

</script>
