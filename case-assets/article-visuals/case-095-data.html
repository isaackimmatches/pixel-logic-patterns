<!DOCTYPE html>

<head>

<style>

    </main>
<script>

const av95dmeters=[...document.querySelectorAll("[data-meter]")];
let av95dtick=0;
setInterval(()=>{
  av95dtick++;
  av95dmeters.forEach((el,i)=>el.textContent=(62+((av95dtick*3+i*9+95)%34))+"%");
},1100);
</script>
