<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-11-data | 시즌 재고 알림</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#f8fafc;color:#0f172a}.av11d-ledger{height:100vh;display:grid;grid-template-columns:310px 1fr 320px;gap:20px;padding:24px}.left,.middle,.right{border:2px solid #0f172a;border-radius:28px;background:#ffffff;box-shadow:8px 8px 0 #0f172a}.left,.right{padding:24px}.left h1{font-size:36px;line-height:1.04;margin:0}.left p{color:#0ea5e9;font-weight:950}.left div{border-top:1px solid #bae6fd;padding:16px 0}.left b{display:block}.left span{color:#0f172a;opacity:.65}.middle{display:grid;grid-template-columns:repeat(7,1fr);align-items:end;gap:10px;padding:22px;background:linear-gradient(180deg,#ffffff,#f8fafc)}.middle i{height:var(--h);border-radius:14px 14px 4px 4px;background:#bae6fd;border:1px solid #0f172a44}.middle i.hot{background:#0ea5e9;box-shadow:0 0 0 6px #bae6fd}.right h2{font-size:30px;margin:0 0 18px}.av11d-metric{border:1px solid #bae6fd;border-radius:18px;padding:14px;margin-bottom:12px}.av11d-metric span{display:block;font-size:12px}.av11d-metric b{font-size:28px}.av11d-metric i{display:block;width:var(--w);height:8px;border-radius:99px;background:#0ea5e9;margin-top:9px}
</style>
</head>
<body>
<main class="av11d-ledger">
        <section class="left"><h1>Inventory Forecast Console</h1><p>시즌 재고 알림 원천 데이터 스냅샷</p><div><b>주문 로그</b><span>SKU key-110</span></div><div><b>센터 재고</b><span>센터 key-111</span></div><div><b>배송 SLA</b><span>노선 key-112</span></div><div><b>프로모션 캘린더</b><span>발주 key-113</span></div></section>
        <section class="middle"><i class="" style="--h:35px"></i><i class="" style="--h:52px"></i><i class="hot" style="--h:69px"></i><i class="" style="--h:86px"></i><i class="" style="--h:103px"></i><i class="" style="--h:120px"></i><i class="" style="--h:137px"></i><i class="" style="--h:34px"></i><i class="" style="--h:51px"></i><i class="" style="--h:68px"></i><i class="" style="--h:85px"></i><i class="hot" style="--h:102px"></i><i class="" style="--h:119px"></i><i class="" style="--h:136px"></i><i class="" style="--h:33px"></i><i class="" style="--h:50px"></i><i class="" style="--h:67px"></i><i class="" style="--h:84px"></i><i class="" style="--h:101px"></i><i class="" style="--h:118px"></i><i class="hot" style="--h:135px"></i><i class="" style="--h:32px"></i><i class="" style="--h:49px"></i><i class="" style="--h:66px"></i><i class="" style="--h:83px"></i><i class="" style="--h:100px"></i><i class="" style="--h:117px"></i><i class="" style="--h:134px"></i><i class="" style="--h:31px"></i><i class="hot" style="--h:48px"></i><i class="" style="--h:65px"></i><i class="" style="--h:82px"></i><i class="" style="--h:99px"></i><i class="" style="--h:116px"></i><i class="" style="--h:133px"></i><i class="" style="--h:30px"></i><i class="" style="--h:47px"></i><i class="" style="--h:64px"></i><i class="hot" style="--h:81px"></i><i class="" style="--h:98px"></i><i class="" style="--h:115px"></i><i class="" style="--h:132px"></i></section>
        <section class="right"><h2>Studio Round</h2>
        <article class="av11d-metric">
            <span>품절 예상시점</span>
            <b data-meter>87%</b>
            <i style="--w:65%"></i>
        </article>
        <article class="av11d-metric">
            <span>과재고 지수</span>
            <b data-meter>69%</b>
            <i style="--w:78%"></i>
        </article>
        <article class="av11d-metric">
            <span>대체 SKU</span>
            <b data-meter>80%</b>
            <i style="--w:91%"></i>
        </article>
        <article class="av11d-metric">
            <span>센터 간 이동량</span>
            <b data-meter>91%</b>
            <i style="--w:64%"></i>
        </article></section>
    </main>
<script>

const av11dmeters=[...document.querySelectorAll("[data-meter]")];
let av11dtick=0;
setInterval(()=>{
  av11dtick++;
  av11dmeters.forEach((el,i)=>el.textContent=(62+((av11dtick*3+i*9+11)%34))+"%");
},1100);
</script>
</body>
</html>
