<!DOCTYPE html>

<style>
*{box-sizing:border-box}

body{background:#fff7ed;color:#1f2937}.av47l-nodes{height:100vh;padding:24px;display:grid;grid-template-rows:90px 1fr;gap:18px}.av47l-nodes header{display:flex;align-items:center;gap:18px;border-radius:28px;background:#1f2937;color:#ffffff;padding:0 24px}.av47l-nodes h1{font-size:30px;margin:0}.av47l-nodes code{margin-left:auto;background:#ffffff;color:#1f2937;border-radius:14px;padding:12px 14px}.av47l-nodes section{display:grid;grid-template-columns:1fr 290px;gap:18px}.av47l-nodes svg,.av47l-nodes aside{border:2px solid #1f2937;border-radius:28px;background:#ffffff;box-shadow:8px 8px 0 #1f2937}.av47l-nodes path{fill:none;stroke:#ffd3b6;stroke-width:5;stroke-dasharray:12 10}. av47l-nodes rect{fill:#fff7ed;stroke:#1f2937;stroke-width:3}. av47l-nodes text{text-anchor:middle;dominant-baseline:middle;font-size:13px;font-weight:950;fill:#1f2937}.av47l-nodes aside{padding:18px;display:grid;gap:14px;align-content:start}.av47l-metric{border:1px solid #ffd3b6;border-radius:18px;padding:14px}.av47l-metric b{font-size:26px}. av47l-metric span{display:block;font-size:12px}. av47l-metric i{display:block;width:var(--w);height:8px;background:#f97316;border-radius:99px;margin-top:9px}

<script>

const av47lmeters=[...document.querySelectorAll("[data-meter]")];
let av47ltick=0;
setInterval(()=>{
  av47ltick++;
  av47lmeters.forEach((el,i)=>el.textContent=(62+((av47ltick*3+i*9+47)%34))+"%");
},1100);
</script>
