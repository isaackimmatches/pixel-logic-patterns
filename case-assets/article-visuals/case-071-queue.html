<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-71-queue | 입출고 차이 탐지</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#1f2333;color:#ffffff}.av71q-command{height:100vh;display:grid;grid-template-columns:320px 1fr 420px;gap:18px;padding:22px;background:radial-gradient(circle at 76% 30%,#4f46e555,transparent 34%),#1f2333}.av71q-command aside,.av71q-command main,.radar{border:1px solid rgba(255,255,255,.15);border-radius:28px;background:rgba(255,255,255,.06)}.av71q-command aside{padding:22px}. av71q-command h1{font-size:34px;line-height:1.04;margin:0}. av71q-command p{color:#c7d2fe;line-height:1.7}.av71q-metric{border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px;margin-top:12px}. av71q-metric b{font-size:26px}. av71q-metric span{display:block}. av71q-metric i{display:block;width:var(--w);height:8px;border-radius:99px;background:#4f46e5;margin-top:9px}.av71q-command main{padding:18px;font-family:ui-monospace,Menlo,monospace;color:#a7f3d0;line-height:1.8;overflow:hidden}.radar{position:relative;overflow:hidden;background-image:repeating-radial-gradient(circle at center,transparent 0 55px,rgba(255,255,255,.15) 56px 58px)}.radar:after{content:"";position:absolute;left:50%;top:50%;width:2px;height:50%;background:#4f46e5;transform-origin:0 0;animation:av71qscan 4s linear infinite}.radar i{position:absolute;left:var(--x);top:var(--y);width:16px;height:16px;border-radius:50%;background:#c7d2fe;box-shadow:0 0 0 8px #c7d2fe33}@keyframes av71qscan{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<section class="av71q-command">
            <aside><h1>Inventory Forecast Console</h1><p>입출고 차이 탐지 실시간 처리 로그</p>
        <article class="av71q-metric">
            <span>품절 예상시점</span>
            <b data-meter>72%</b>
            <i style="--w:85%"></i>
        </article>
        <article class="av71q-metric">
            <span>과재고 지수</span>
            <b data-meter>83%</b>
            <i style="--w:58%"></i>
        </article>
        <article class="av71q-metric">
            <span>대체 SKU</span>
            <b data-meter>94%</b>
            <i style="--w:71%"></i>
        </article>
        <article class="av71q-metric">
            <span>센터 간 이동량</span>
            <b data-meter>76%</b>
            <i style="--w:84%"></i>
        </article></aside>
            <main id="av71q-stream"></main>
            <div class="radar"><i style="--x:27%;--y:23%"></i><i style="--x:50%;--y:54%"></i><i style="--x:73%;--y:21%"></i><i style="--x:34%;--y:52%"></i><i style="--x:57%;--y:19%"></i><i style="--x:18%;--y:50%"></i><i style="--x:41%;--y:17%"></i><i style="--x:64%;--y:48%"></i><i style="--x:25%;--y:79%"></i></div>
        </section>
<script>
const av71qs=document.getElementById("av71q-stream");const av71qlogs=["발주량 추천 queued","품절 예상시점 threshold crossed","owner=SCM 운영팀","sla.check passed","handoff ticket 71-A"];let av71qn=0;setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+av71qlogs[av71qn++%av71qlogs.length];av71qs.prepend(p);while(av71qs.children.length>26)av71qs.lastElementChild.remove();},430);
const av71qmeters=[...document.querySelectorAll("[data-meter]")];
let av71qtick=0;
setInterval(()=>{
  av71qtick++;
  av71qmeters.forEach((el,i)=>el.textContent=(62+((av71qtick*3+i*9+71)%34))+"%");
},1100);
</script>
</body>
</html>
