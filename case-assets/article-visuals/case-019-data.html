<script>

const av19dmeters=[...document.querySelectorAll("[data-meter]")];
let av19dtick=0;
setInterval(()=>{
  av19dtick++;
  av19dmeters.forEach((el,i)=>el.textContent=(62+((av19dtick*3+i*9+19)%34))+"%");
},1100);
</script>
