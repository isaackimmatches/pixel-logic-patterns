<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-43-queue | SEO FAQ 생성</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#1f2333;color:#ffffff}.av43q-command{height:100vh;display:grid;grid-template-columns:320px 1fr 420px;gap:18px;padding:22px;background:radial-gradient(circle at 76% 30%,#4f46e555,transparent 34%),#1f2333}.av43q-command aside,.av43q-command main,.radar{border:1px solid rgba(255,255,255,.15);border-radius:28px;background:rgba(255,255,255,.06)}.av43q-command aside{padding:22px}. av43q-command h1{font-size:34px;line-height:1.04;margin:0}. av43q-command p{color:#c7d2fe;line-height:1.7}.av43q-metric{border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px;margin-top:12px}. av43q-metric b{font-size:26px}. av43q-metric span{display:block}. av43q-metric i{display:block;width:var(--w);height:8px;border-radius:99px;background:#4f46e5;margin-top:9px}.av43q-command main{padding:18px;font-family:ui-monospace,Menlo,monospace;color:#a7f3d0;line-height:1.8;overflow:hidden}.radar{position:relative;overflow:hidden;background-image:repeating-radial-gradient(circle at center,transparent 0 55px,rgba(255,255,255,.15) 56px 58px)}.radar:after{content:"";position:absolute;left:50%;top:50%;width:2px;height:50%;background:#4f46e5;transform-origin:0 0;animation:av43qscan 4s linear infinite}.radar i{position:absolute;left:var(--x);top:var(--y);width:16px;height:16px;border-radius:50%;background:#c7d2fe;box-shadow:0 0 0 8px #c7d2fe33}@keyframes av43qscan{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<section class="av43q-command">
            <aside><h1>SEO FAQ AX Console</h1><p>SEO FAQ 생성 실시간 처리 로그</p>
        <article class="av43q-metric">
            <span>이상치</span>
            <b data-meter>79%</b>
            <i style="--w:57%"></i>
        </article>
        <article class="av43q-metric">
            <span>우선순위</span>
            <b data-meter>90%</b>
            <i style="--w:70%"></i>
        </article>
        <article class="av43q-metric">
            <span>자동 처리율</span>
            <b data-meter>72%</b>
            <i style="--w:83%"></i>
        </article>
        <article class="av43q-metric">
            <span>검수 필요</span>
            <b data-meter>83%</b>
            <i style="--w:56%"></i>
        </article></aside>
            <main id="av43q-stream"></main>
            <div class="radar"><i style="--x:61%;--y:59%"></i><i style="--x:22%;--y:26%"></i><i style="--x:45%;--y:57%"></i><i style="--x:68%;--y:24%"></i><i style="--x:29%;--y:55%"></i><i style="--x:52%;--y:22%"></i><i style="--x:75%;--y:53%"></i><i style="--x:36%;--y:20%"></i><i style="--x:59%;--y:51%"></i></div>
        </section>
<script>
const av43qs=document.getElementById("av43q-stream");const av43qlogs=["자동 실행 queued","이상치 threshold crossed","owner=브랜드 운영팀","sla.check passed","handoff ticket 43-A"];let av43qn=0;setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+av43qlogs[av43qn++%av43qlogs.length];av43qs.prepend(p);while(av43qs.children.length>26)av43qs.lastElementChild.remove();},430);
const av43qmeters=[...document.querySelectorAll("[data-meter]")];
let av43qtick=0;
setInterval(()=>{
  av43qtick++;
  av43qmeters.forEach((el,i)=>el.textContent=(62+((av43qtick*3+i*9+43)%34))+"%");
},1100);
</script>
</body>
</html>
