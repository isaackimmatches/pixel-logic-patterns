<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-03-queue | SKU 이미지 누락·중복 탐지</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#1f2937;color:#ffffff}.av03q-command{height:100vh;display:grid;grid-template-columns:320px 1fr 420px;gap:18px;padding:22px;background:radial-gradient(circle at 76% 30%,#f9731655,transparent 34%),#1f2937}.av03q-command aside,.av03q-command main,.radar{border:1px solid rgba(255,255,255,.15);border-radius:28px;background:rgba(255,255,255,.06)}.av03q-command aside{padding:22px}. av03q-command h1{font-size:34px;line-height:1.04;margin:0}. av03q-command p{color:#ffd3b6;line-height:1.7}.av03q-metric{border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px;margin-top:12px}. av03q-metric b{font-size:26px}. av03q-metric span{display:block}. av03q-metric i{display:block;width:var(--w);height:8px;border-radius:99px;background:#f97316;margin-top:9px}.av03q-command main{padding:18px;font-family:ui-monospace,Menlo,monospace;color:#a7f3d0;line-height:1.8;overflow:hidden}.radar{position:relative;overflow:hidden;background-image:repeating-radial-gradient(circle at center,transparent 0 55px,rgba(255,255,255,.15) 56px 58px)}.radar:after{content:"";position:absolute;left:50%;top:50%;width:2px;height:50%;background:#f97316;transform-origin:0 0;animation:av03qscan 4s linear infinite}.radar i{position:absolute;left:var(--x);top:var(--y);width:16px;height:16px;border-radius:50%;background:#ffd3b6;box-shadow:0 0 0 8px #ffd3b633}@keyframes av03qscan{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<section class="av03q-command">
            <aside><h1>Creative Asset Studio</h1><p>SKU 이미지 누락·중복 탐지 실시간 처리 로그</p>
        <article class="av03q-metric">
            <span>피사체 경계</span>
            <b data-meter>89%</b>
            <i style="--w:57%"></i>
        </article>
        <article class="av03q-metric">
            <span>프레임 변화</span>
            <b data-meter>71%</b>
            <i style="--w:70%"></i>
        </article>
        <article class="av03q-metric">
            <span>톤 불일치</span>
            <b data-meter>82%</b>
            <i style="--w:83%"></i>
        </article>
        <article class="av03q-metric">
            <span>저작권 위험</span>
            <b data-meter>93%</b>
            <i style="--w:56%"></i>
        </article></aside>
            <main id="av03q-stream"></main>
            <div class="radar"><i style="--x:21%;--y:19%"></i><i style="--x:44%;--y:50%"></i><i style="--x:67%;--y:17%"></i><i style="--x:28%;--y:48%"></i><i style="--x:51%;--y:79%"></i><i style="--x:74%;--y:46%"></i><i style="--x:35%;--y:77%"></i><i style="--x:58%;--y:44%"></i><i style="--x:19%;--y:75%"></i></div>
        </section>
<script>
const av03qs=document.getElementById("av03q-stream");const av03qlogs=["자동 마스킹 queued","피사체 경계 threshold crossed","owner=콘텐츠 제작팀","sla.check passed","handoff ticket 3-A"];let av03qn=0;setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+av03qlogs[av03qn++%av03qlogs.length];av03qs.prepend(p);while(av03qs.children.length>26)av03qs.lastElementChild.remove();},430);
const av03qmeters=[...document.querySelectorAll("[data-meter]")];
let av03qtick=0;
setInterval(()=>{
  av03qtick++;
  av03qmeters.forEach((el,i)=>el.textContent=(62+((av03qtick*3+i*9+3)%34))+"%");
},1100);
</script>
</body>
</html>
