<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-67-queue | 불량 픽셀 검출 시각 AI</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#211a36;color:#ffffff}.av67q-command{height:100vh;display:grid;grid-template-columns:320px 1fr 420px;gap:18px;padding:22px;background:radial-gradient(circle at 76% 30%,#7c3aed55,transparent 34%),#211a36}.av67q-command aside,.av67q-command main,.radar{border:1px solid rgba(255,255,255,.15);border-radius:28px;background:rgba(255,255,255,.06)}.av67q-command aside{padding:22px}. av67q-command h1{font-size:34px;line-height:1.04;margin:0}. av67q-command p{color:#d8b4fe;line-height:1.7}.av67q-metric{border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px;margin-top:12px}. av67q-metric b{font-size:26px}. av67q-metric span{display:block}. av67q-metric i{display:block;width:var(--w);height:8px;border-radius:99px;background:#7c3aed;margin-top:9px}.av67q-command main{padding:18px;font-family:ui-monospace,Menlo,monospace;color:#a7f3d0;line-height:1.8;overflow:hidden}.radar{position:relative;overflow:hidden;background-image:repeating-radial-gradient(circle at center,transparent 0 55px,rgba(255,255,255,.15) 56px 58px)}.radar:after{content:"";position:absolute;left:50%;top:50%;width:2px;height:50%;background:#7c3aed;transform-origin:0 0;animation:av67qscan 4s linear infinite}.radar i{position:absolute;left:var(--x);top:var(--y);width:16px;height:16px;border-radius:50%;background:#d8b4fe;box-shadow:0 0 0 8px #d8b4fe33}@keyframes av67qscan{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<section class="av67q-command">
            <aside><h1>Review Defect Sentinel</h1><p>불량 픽셀 검출 시각 AI 실시간 처리 로그</p>
        <article class="av67q-metric">
            <span>부정 키워드 급증</span>
            <b data-meter>73%</b>
            <i style="--w:81%"></i>
        </article>
        <article class="av67q-metric">
            <span>동일 로트 반복</span>
            <b data-meter>84%</b>
            <i style="--w:54%"></i>
        </article>
        <article class="av67q-metric">
            <span>불량 확률</span>
            <b data-meter>95%</b>
            <i style="--w:67%"></i>
        </article>
        <article class="av67q-metric">
            <span>회수 우선순위</span>
            <b data-meter>77%</b>
            <i style="--w:80%"></i>
        </article></aside>
            <main id="av67q-stream"></main>
            <div class="radar"><i style="--x:23%;--y:19%"></i><i style="--x:46%;--y:50%"></i><i style="--x:69%;--y:17%"></i><i style="--x:30%;--y:48%"></i><i style="--x:53%;--y:79%"></i><i style="--x:76%;--y:46%"></i><i style="--x:37%;--y:77%"></i><i style="--x:60%;--y:44%"></i><i style="--x:21%;--y:75%"></i></div>
        </section>
<script>
const av67qs=document.getElementById("av67q-stream");const av67qlogs=["불량 티켓 생성 queued","부정 키워드 급증 threshold crossed","owner=품질/MD 운영팀","sla.check passed","handoff ticket 67-A"];let av67qn=0;setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+av67qlogs[av67qn++%av67qlogs.length];av67qs.prepend(p);while(av67qs.children.length>26)av67qs.lastElementChild.remove();},430);
const av67qmeters=[...document.querySelectorAll("[data-meter]")];
let av67qtick=0;
setInterval(()=>{
  av67qtick++;
  av67qmeters.forEach((el,i)=>el.textContent=(62+((av67qtick*3+i*9+67)%34))+"%");
},1100);
</script>
</body>
</html>
