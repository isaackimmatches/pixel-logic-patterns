<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-19-queue | 배송 지연 사전 알림</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#10251d;color:#ffffff}.av19q-command{height:100vh;display:grid;grid-template-columns:320px 1fr 420px;gap:18px;padding:22px;background:radial-gradient(circle at 76% 30%,#10b98155,transparent 34%),#10251d}.av19q-command aside,.av19q-command main,.radar{border:1px solid rgba(255,255,255,.15);border-radius:28px;background:rgba(255,255,255,.06)}.av19q-command aside{padding:22px}. av19q-command h1{font-size:34px;line-height:1.04;margin:0}. av19q-command p{color:#b7f3d4;line-height:1.7}.av19q-metric{border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px;margin-top:12px}. av19q-metric b{font-size:26px}. av19q-metric span{display:block}. av19q-metric i{display:block;width:var(--w);height:8px;border-radius:99px;background:#10b981;margin-top:9px}.av19q-command main{padding:18px;font-family:ui-monospace,Menlo,monospace;color:#a7f3d0;line-height:1.8;overflow:hidden}.radar{position:relative;overflow:hidden;background-image:repeating-radial-gradient(circle at center,transparent 0 55px,rgba(255,255,255,.15) 56px 58px)}.radar:after{content:"";position:absolute;left:50%;top:50%;width:2px;height:50%;background:#10b981;transform-origin:0 0;animation:av19qscan 4s linear infinite}.radar i{position:absolute;left:var(--x);top:var(--y);width:16px;height:16px;border-radius:50%;background:#b7f3d4;box-shadow:0 0 0 8px #b7f3d433}@keyframes av19qscan{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<section class="av19q-command">
            <aside><h1>Inventory Forecast Console</h1><p>배송 지연 사전 알림 실시간 처리 로그</p>
        <article class="av19q-metric">
            <span>품절 예상시점</span>
            <b data-meter>85%</b>
            <i style="--w:73%"></i>
        </article>
        <article class="av19q-metric">
            <span>과재고 지수</span>
            <b data-meter>96%</b>
            <i style="--w:86%"></i>
        </article>
        <article class="av19q-metric">
            <span>대체 SKU</span>
            <b data-meter>78%</b>
            <i style="--w:59%"></i>
        </article>
        <article class="av19q-metric">
            <span>센터 간 이동량</span>
            <b data-meter>89%</b>
            <i style="--w:72%"></i>
        </article></aside>
            <main id="av19q-stream"></main>
            <div class="radar"><i style="--x:37%;--y:35%"></i><i style="--x:60%;--y:66%"></i><i style="--x:21%;--y:33%"></i><i style="--x:44%;--y:64%"></i><i style="--x:67%;--y:31%"></i><i style="--x:28%;--y:62%"></i><i style="--x:51%;--y:29%"></i><i style="--x:74%;--y:60%"></i><i style="--x:35%;--y:27%"></i></div>
        </section>
<script>
const av19qs=document.getElementById("av19q-stream");const av19qlogs=["발주량 추천 queued","품절 예상시점 threshold crossed","owner=SCM 운영팀","sla.check passed","handoff ticket 19-A"];let av19qn=0;setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+av19qlogs[av19qn++%av19qlogs.length];av19qs.prepend(p);while(av19qs.children.length>26)av19qs.lastElementChild.remove();},430);
const av19qmeters=[...document.querySelectorAll("[data-meter]")];
let av19qtick=0;
setInterval(()=>{
  av19qtick++;
  av19qmeters.forEach((el,i)=>el.textContent=(62+((av19qtick*3+i*9+19)%34))+"%");
},1100);
</script>
</body>
</html>
