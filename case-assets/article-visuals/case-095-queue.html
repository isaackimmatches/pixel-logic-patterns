<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-95-queue | 프로젝트 리스크 예측</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#211a36;color:#ffffff}.av95q-command{height:100vh;display:grid;grid-template-columns:320px 1fr 420px;gap:18px;padding:22px;background:radial-gradient(circle at 76% 30%,#7c3aed55,transparent 34%),#211a36}.av95q-command aside,.av95q-command main,.radar{border:1px solid rgba(255,255,255,.15);border-radius:28px;background:rgba(255,255,255,.06)}.av95q-command aside{padding:22px}. av95q-command h1{font-size:34px;line-height:1.04;margin:0}. av95q-command p{color:#d8b4fe;line-height:1.7}.av95q-metric{border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px;margin-top:12px}. av95q-metric b{font-size:26px}. av95q-metric span{display:block}. av95q-metric i{display:block;width:var(--w);height:8px;border-radius:99px;background:#7c3aed;margin-top:9px}.av95q-command main{padding:18px;font-family:ui-monospace,Menlo,monospace;color:#a7f3d0;line-height:1.8;overflow:hidden}.radar{position:relative;overflow:hidden;background-image:repeating-radial-gradient(circle at center,transparent 0 55px,rgba(255,255,255,.15) 56px 58px)}.radar:after{content:"";position:absolute;left:50%;top:50%;width:2px;height:50%;background:#7c3aed;transform-origin:0 0;animation:av95qscan 4s linear infinite}.radar i{position:absolute;left:var(--x);top:var(--y);width:16px;height:16px;border-radius:50%;background:#d8b4fe;box-shadow:0 0 0 8px #d8b4fe33}@keyframes av95qscan{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<section class="av95q-command">
            <aside><h1>People Ops Prediction Desk</h1><p>프로젝트 리스크 예측 실시간 처리 로그</p>
        <article class="av95q-metric">
            <span>이탈 위험</span>
            <b data-meter>95%</b>
            <i style="--w:69%"></i>
        </article>
        <article class="av95q-metric">
            <span>권한 이상</span>
            <b data-meter>77%</b>
            <i style="--w:82%"></i>
        </article>
        <article class="av95q-metric">
            <span>응답 지연</span>
            <b data-meter>88%</b>
            <i style="--w:55%"></i>
        </article>
        <article class="av95q-metric">
            <span>리텐션 점수</span>
            <b data-meter>70%</b>
            <i style="--w:68%"></i>
        </article></aside>
            <main id="av95q-stream"></main>
            <div class="radar"><i style="--x:51%;--y:47%"></i><i style="--x:74%;--y:78%"></i><i style="--x:35%;--y:45%"></i><i style="--x:58%;--y:76%"></i><i style="--x:19%;--y:43%"></i><i style="--x:42%;--y:74%"></i><i style="--x:65%;--y:41%"></i><i style="--x:26%;--y:72%"></i><i style="--x:49%;--y:39%"></i></div>
        </section>
<script>
const av95qs=document.getElementById("av95q-stream");const av95qlogs=["알림 발송 queued","이탈 위험 threshold crossed","owner=조직/구독 운영팀","sla.check passed","handoff ticket 95-A"];let av95qn=0;setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+av95qlogs[av95qn++%av95qlogs.length];av95qs.prepend(p);while(av95qs.children.length>26)av95qs.lastElementChild.remove();},430);
const av95qmeters=[...document.querySelectorAll("[data-meter]")];
let av95qtick=0;
setInterval(()=>{
  av95qtick++;
  av95qmeters.forEach((el,i)=>el.textContent=(62+((av95qtick*3+i*9+95)%34))+"%");
},1100);
</script>
</body>
</html>
