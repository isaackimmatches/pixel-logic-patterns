<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-25-logic | 실시간 재고 예측 로직</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#f7fbff;color:#111827}.av25l-compiler{height:100vh;display:grid;grid-template-columns:360px 1fr 300px;gap:18px;padding:22px}.editor,.preview,.weights{border:2px solid #111827;border-radius:28px;background:#ffffff;box-shadow:8px 8px 0 #111827}.editor{padding:24px}.editor h1{font-size:32px;line-height:1.04;margin:0 0 18px}.editor p{border:1px solid #9bd4ff;border-radius:16px;padding:14px}.editor b{display:block;color:#2563eb}.editor span{display:block}.preview{display:grid;place-items:center;overflow:hidden}.preview canvas{width:100%;height:100%}.weights{padding:20px}.weights label{display:block;margin-bottom:28px;font-weight:950}.weights input{display:block;width:100%;accent-color:#2563eb;margin-top:12px}
</style>
</head>
<body>
<main class="av25l-compiler">
            <section class="editor"><h1>Inventory Forecast Console Rule Compiler</h1><p><b>rule.1</b><span>when 품절 예상시점 then 발주량 추천</span></p><p><b>rule.2</b><span>when 과재고 지수 then 대체상품 노출</span></p><p><b>rule.3</b><span>when 대체 SKU then 입고 우선순위 변경</span></p><p><b>rule.4</b><span>when 센터 간 이동량 then 지연 알림</span></p></section>
            <section class="preview"><canvas id="av25l-canvas" width="780" height="560"></canvas></section>
            <section class="weights"><label>주문 로그<input type="range" value="70" disabled></label><label>센터 재고<input type="range" value="87" disabled></label><label>배송 SLA<input type="range" value="54" disabled></label><label>프로모션 캘린더<input type="range" value="71" disabled></label></section>
        </main>
<script>
const c=document.getElementById("av25l-canvas"),ctx=c.getContext("2d");let t=0;function draw(){t+=.03;ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle="#f7fbff";ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<10;i++){ctx.beginPath();ctx.arc(90+i*70,290+Math.sin(t+i)*130,26+i%3*7,0,Math.PI*2);ctx.fillStyle=i%2?"#9bd4ff":"#2563eb";ctx.fill();ctx.strokeStyle="#111827";ctx.lineWidth=4;ctx.stroke();}ctx.fillStyle="#111827";ctx.font="800 34px Inter";ctx.fillText("SKU decision surface",42,68);requestAnimationFrame(draw)}draw();
</script>
</body>
</html>
