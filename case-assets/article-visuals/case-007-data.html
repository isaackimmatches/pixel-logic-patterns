<style>

<script>

const av07dmeters=[...document.querySelectorAll("[data-meter]")];
let av07dtick=0;
setInterval(()=>{
  av07dtick++;
  av07dmeters.forEach((el,i)=>el.textContent=(62+((av07dtick*3+i*9+7)%34))+"%");
},1100);
</script>
