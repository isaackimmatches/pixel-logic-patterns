<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-75-data | 에너지 사용량 최적화</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#f4f6ff;color:#1f2333}.av75d-ledger{height:100vh;display:grid;grid-template-columns:310px 1fr 320px;gap:20px;padding:24px}.left,.middle,.right{border:2px solid #1f2333;border-radius:28px;background:#ffffff;box-shadow:8px 8px 0 #1f2333}.left,.right{padding:24px}.left h1{font-size:36px;line-height:1.04;margin:0}.left p{color:#4f46e5;font-weight:950}.left div{border-top:1px solid #c7d2fe;padding:16px 0}.left b{display:block}.left span{color:#1f2333;opacity:.65}.middle{display:grid;grid-template-columns:repeat(7,1fr);align-items:end;gap:10px;padding:22px;background:linear-gradient(180deg,#ffffff,#f4f6ff)}.middle i{height:var(--h);border-radius:14px 14px 4px 4px;background:#c7d2fe;border:1px solid #1f233344}.middle i.hot{background:#4f46e5;box-shadow:0 0 0 6px #c7d2fe}.right h2{font-size:30px;margin:0 0 18px}.av75d-metric{border:1px solid #c7d2fe;border-radius:18px;padding:14px;margin-bottom:12px}.av75d-metric span{display:block;font-size:12px}.av75d-metric b{font-size:28px}.av75d-metric i{display:block;width:var(--w);height:8px;border-radius:99px;background:#4f46e5;margin-top:9px}
</style>
</head>
<body>
<main class="av75d-ledger">
        <section class="left"><h1>Factory Signal Monitor</h1><p>에너지 사용량 최적화 원천 데이터 스냅샷</p><div><b>MES 로그</b><span>라인 key-750</span></div><div><b>센서 스트림</b><span>설비 key-751</span></div><div><b>검사 이미지</b><span>LOT key-752</span></div><div><b>작업지시서</b><span>검사 key-753</span></div></section>
        <section class="middle"><i class="" style="--h:99px"></i><i class="" style="--h:116px"></i><i class="" style="--h:133px"></i><i class="hot" style="--h:30px"></i><i class="" style="--h:47px"></i><i class="" style="--h:64px"></i><i class="" style="--h:81px"></i><i class="" style="--h:98px"></i><i class="" style="--h:115px"></i><i class="" style="--h:132px"></i><i class="" style="--h:29px"></i><i class="" style="--h:46px"></i><i class="hot" style="--h:63px"></i><i class="" style="--h:80px"></i><i class="" style="--h:97px"></i><i class="" style="--h:114px"></i><i class="" style="--h:131px"></i><i class="" style="--h:28px"></i><i class="" style="--h:45px"></i><i class="" style="--h:62px"></i><i class="" style="--h:79px"></i><i class="hot" style="--h:96px"></i><i class="" style="--h:113px"></i><i class="" style="--h:130px"></i><i class="" style="--h:27px"></i><i class="" style="--h:44px"></i><i class="" style="--h:61px"></i><i class="" style="--h:78px"></i><i class="" style="--h:95px"></i><i class="" style="--h:112px"></i><i class="hot" style="--h:129px"></i><i class="" style="--h:26px"></i><i class="" style="--h:43px"></i><i class="" style="--h:60px"></i><i class="" style="--h:77px"></i><i class="" style="--h:94px"></i><i class="" style="--h:111px"></i><i class="" style="--h:128px"></i><i class="" style="--h:25px"></i><i class="hot" style="--h:42px"></i><i class="" style="--h:59px"></i><i class="" style="--h:76px"></i></section>
        <section class="right"><h2>Aster Commerce</h2>
        <article class="av75d-metric">
            <span>설비 편차</span>
            <b data-meter>71%</b>
            <i style="--w:89%"></i>
        </article>
        <article class="av75d-metric">
            <span>불량 픽셀</span>
            <b data-meter>82%</b>
            <i style="--w:62%"></i>
        </article>
        <article class="av75d-metric">
            <span>라인 병목</span>
            <b data-meter>93%</b>
            <i style="--w:75%"></i>
        </article>
        <article class="av75d-metric">
            <span>정비 우선순위</span>
            <b data-meter>75%</b>
            <i style="--w:88%"></i>
        </article></section>
    </main>
<script>

const av75dmeters=[...document.querySelectorAll("[data-meter]")];
let av75dtick=0;
setInterval(()=>{
  av75dtick++;
  av75dmeters.forEach((el,i)=>el.textContent=(62+((av75dtick*3+i*9+75)%34))+"%");
},1100);
</script>
</body>
</html>
