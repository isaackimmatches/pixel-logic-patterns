<style>

<script>

const av71dmeters=[...document.querySelectorAll("[data-meter]")];
let av71dtick=0;
setInterval(()=>{
  av71dtick++;
  av71dmeters.forEach((el,i)=>el.textContent=(62+((av71dtick*3+i*9+71)%34))+"%");
},1100);
</script>
