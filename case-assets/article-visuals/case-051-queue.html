<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-51-queue | 다국어 캠페인 운영</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#111827;color:#ffffff}.av51q-command{height:100vh;display:grid;grid-template-columns:320px 1fr 420px;gap:18px;padding:22px;background:radial-gradient(circle at 76% 30%,#2563eb55,transparent 34%),#111827}.av51q-command aside,.av51q-command main,.radar{border:1px solid rgba(255,255,255,.15);border-radius:28px;background:rgba(255,255,255,.06)}.av51q-command aside{padding:22px}. av51q-command h1{font-size:34px;line-height:1.04;margin:0}. av51q-command p{color:#9bd4ff;line-height:1.7}.av51q-metric{border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px;margin-top:12px}. av51q-metric b{font-size:26px}. av51q-metric span{display:block}. av51q-metric i{display:block;width:var(--w);height:8px;border-radius:99px;background:#2563eb;margin-top:9px}.av51q-command main{padding:18px;font-family:ui-monospace,Menlo,monospace;color:#a7f3d0;line-height:1.8;overflow:hidden}.radar{position:relative;overflow:hidden;background-image:repeating-radial-gradient(circle at center,transparent 0 55px,rgba(255,255,255,.15) 56px 58px)}.radar:after{content:"";position:absolute;left:50%;top:50%;width:2px;height:50%;background:#2563eb;transform-origin:0 0;animation:av51qscan 4s linear infinite}.radar i{position:absolute;left:var(--x);top:var(--y);width:16px;height:16px;border-radius:50%;background:#9bd4ff;box-shadow:0 0 0 8px #9bd4ff33}@keyframes av51qscan{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<section class="av51q-command">
            <aside><h1>Performance Control Tower</h1><p>다국어 캠페인 운영 실시간 처리 로그</p>
        <article class="av51q-metric">
            <span>CTR 예측</span>
            <b data-meter>77%</b>
            <i style="--w:65%"></i>
        </article>
        <article class="av51q-metric">
            <span>CPC 변동</span>
            <b data-meter>88%</b>
            <i style="--w:78%"></i>
        </article>
        <article class="av51q-metric">
            <span>피로도</span>
            <b data-meter>70%</b>
            <i style="--w:91%"></i>
        </article>
        <article class="av51q-metric">
            <span>증분 ROAS</span>
            <b data-meter>81%</b>
            <i style="--w:64%"></i>
        </article></aside>
            <main id="av51q-stream"></main>
            <div class="radar"><i style="--x:69%;--y:67%"></i><i style="--x:30%;--y:34%"></i><i style="--x:53%;--y:65%"></i><i style="--x:76%;--y:32%"></i><i style="--x:37%;--y:63%"></i><i style="--x:60%;--y:30%"></i><i style="--x:21%;--y:61%"></i><i style="--x:44%;--y:28%"></i><i style="--x:67%;--y:59%"></i></div>
        </section>
<script>
const av51qs=document.getElementById("av51q-stream");const av51qlogs=["입찰 조정 queued","CTR 예측 threshold crossed","owner=퍼포먼스 마케팅팀","sla.check passed","handoff ticket 51-A"];let av51qn=0;setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+av51qlogs[av51qn++%av51qlogs.length];av51qs.prepend(p);while(av51qs.children.length>26)av51qs.lastElementChild.remove();},430);
const av51qmeters=[...document.querySelectorAll("[data-meter]")];
let av51qtick=0;
setInterval(()=>{
  av51qtick++;
  av51qmeters.forEach((el,i)=>el.textContent=(62+((av51qtick*3+i*9+51)%34))+"%");
},1100);
</script>
</body>
</html>
