<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-35-queue | 숏폼 자막·챕터 자동화</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#0f172a;color:#ffffff}.av35q-command{height:100vh;display:grid;grid-template-columns:320px 1fr 420px;gap:18px;padding:22px;background:radial-gradient(circle at 76% 30%,#0ea5e955,transparent 34%),#0f172a}.av35q-command aside,.av35q-command main,.radar{border:1px solid rgba(255,255,255,.15);border-radius:28px;background:rgba(255,255,255,.06)}.av35q-command aside{padding:22px}. av35q-command h1{font-size:34px;line-height:1.04;margin:0}. av35q-command p{color:#bae6fd;line-height:1.7}.av35q-metric{border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px;margin-top:12px}. av35q-metric b{font-size:26px}. av35q-metric span{display:block}. av35q-metric i{display:block;width:var(--w);height:8px;border-radius:99px;background:#0ea5e9;margin-top:9px}.av35q-command main{padding:18px;font-family:ui-monospace,Menlo,monospace;color:#a7f3d0;line-height:1.8;overflow:hidden}.radar{position:relative;overflow:hidden;background-image:repeating-radial-gradient(circle at center,transparent 0 55px,rgba(255,255,255,.15) 56px 58px)}.radar:after{content:"";position:absolute;left:50%;top:50%;width:2px;height:50%;background:#0ea5e9;transform-origin:0 0;animation:av35qscan 4s linear infinite}.radar i{position:absolute;left:var(--x);top:var(--y);width:16px;height:16px;border-radius:50%;background:#bae6fd;box-shadow:0 0 0 8px #bae6fd33}@keyframes av35qscan{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<section class="av35q-command">
            <aside><h1>Creative Asset Studio</h1><p>숏폼 자막·챕터 자동화 실시간 처리 로그</p>
        <article class="av35q-metric">
            <span>피사체 경계</span>
            <b data-meter>81%</b>
            <i style="--w:89%"></i>
        </article>
        <article class="av35q-metric">
            <span>프레임 변화</span>
            <b data-meter>92%</b>
            <i style="--w:62%"></i>
        </article>
        <article class="av35q-metric">
            <span>톤 불일치</span>
            <b data-meter>74%</b>
            <i style="--w:75%"></i>
        </article>
        <article class="av35q-metric">
            <span>저작권 위험</span>
            <b data-meter>85%</b>
            <i style="--w:88%"></i>
        </article></aside>
            <main id="av35q-stream"></main>
            <div class="radar"><i style="--x:53%;--y:51%"></i><i style="--x:76%;--y:18%"></i><i style="--x:37%;--y:49%"></i><i style="--x:60%;--y:16%"></i><i style="--x:21%;--y:47%"></i><i style="--x:44%;--y:78%"></i><i style="--x:67%;--y:45%"></i><i style="--x:28%;--y:76%"></i><i style="--x:51%;--y:43%"></i></div>
        </section>
<script>
const av35qs=document.getElementById("av35q-stream");const av35qlogs=["자동 마스킹 queued","피사체 경계 threshold crossed","owner=콘텐츠 제작팀","sla.check passed","handoff ticket 35-A"];let av35qn=0;setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+av35qlogs[av35qn++%av35qlogs.length];av35qs.prepend(p);while(av35qs.children.length>26)av35qs.lastElementChild.remove();},430);
const av35qmeters=[...document.querySelectorAll("[data-meter]")];
let av35qtick=0;
setInterval(()=>{
  av35qtick++;
  av35qmeters.forEach((el,i)=>el.textContent=(62+((av35qtick*3+i*9+35)%34))+"%");
},1100);
</script>
</body>
</html>
