<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-87-queue | 법무 리스크 큐레이션</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#1f2937;color:#ffffff}.av87q-command{height:100vh;display:grid;grid-template-columns:320px 1fr 420px;gap:18px;padding:22px;background:radial-gradient(circle at 76% 30%,#f9731655,transparent 34%),#1f2937}.av87q-command aside,.av87q-command main,.radar{border:1px solid rgba(255,255,255,.15);border-radius:28px;background:rgba(255,255,255,.06)}.av87q-command aside{padding:22px}. av87q-command h1{font-size:34px;line-height:1.04;margin:0}. av87q-command p{color:#ffd3b6;line-height:1.7}.av87q-metric{border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px;margin-top:12px}. av87q-metric b{font-size:26px}. av87q-metric span{display:block}. av87q-metric i{display:block;width:var(--w);height:8px;border-radius:99px;background:#f97316;margin-top:9px}.av87q-command main{padding:18px;font-family:ui-monospace,Menlo,monospace;color:#a7f3d0;line-height:1.8;overflow:hidden}.radar{position:relative;overflow:hidden;background-image:repeating-radial-gradient(circle at center,transparent 0 55px,rgba(255,255,255,.15) 56px 58px)}.radar:after{content:"";position:absolute;left:50%;top:50%;width:2px;height:50%;background:#f97316;transform-origin:0 0;animation:av87qscan 4s linear infinite}.radar i{position:absolute;left:var(--x);top:var(--y);width:16px;height:16px;border-radius:50%;background:#ffd3b6;box-shadow:0 0 0 8px #ffd3b633}@keyframes av87qscan{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<section class="av87q-command">
            <aside><h1>Document Risk Workbench</h1><p>법무 리스크 큐레이션 실시간 처리 로그</p>
        <article class="av87q-metric">
            <span>핵심 조항</span>
            <b data-meter>68%</b>
            <i style="--w:61%"></i>
        </article>
        <article class="av87q-metric">
            <span>금액 불일치</span>
            <b data-meter>79%</b>
            <i style="--w:74%"></i>
        </article>
        <article class="av87q-metric">
            <span>권한 예외</span>
            <b data-meter>90%</b>
            <i style="--w:87%"></i>
        </article>
        <article class="av87q-metric">
            <span>검토 위험도</span>
            <b data-meter>72%</b>
            <i style="--w:60%"></i>
        </article></aside>
            <main id="av87q-stream"></main>
            <div class="radar"><i style="--x:43%;--y:39%"></i><i style="--x:66%;--y:70%"></i><i style="--x:27%;--y:37%"></i><i style="--x:50%;--y:68%"></i><i style="--x:73%;--y:35%"></i><i style="--x:34%;--y:66%"></i><i style="--x:57%;--y:33%"></i><i style="--x:18%;--y:64%"></i><i style="--x:41%;--y:31%"></i></div>
        </section>
<script>
const av87qs=document.getElementById("av87q-stream");const av87qlogs=["조항 추출 queued","핵심 조항 threshold crossed","owner=법무/재무 검토팀","sla.check passed","handoff ticket 87-A"];let av87qn=0;setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+av87qlogs[av87qn++%av87qlogs.length];av87qs.prepend(p);while(av87qs.children.length>26)av87qs.lastElementChild.remove();},430);
const av87qmeters=[...document.querySelectorAll("[data-meter]")];
let av87qtick=0;
setInterval(()=>{
  av87qtick++;
  av87qmeters.forEach((el,i)=>el.textContent=(62+((av87qtick*3+i*9+87)%34))+"%");
},1100);
</script>
</body>
</html>
