<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-39-queue | CRM 세그먼트 자동 생성</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#211a36;color:#ffffff}.av39q-command{height:100vh;display:grid;grid-template-columns:320px 1fr 420px;gap:18px;padding:22px;background:radial-gradient(circle at 76% 30%,#7c3aed55,transparent 34%),#211a36}.av39q-command aside,.av39q-command main,.radar{border:1px solid rgba(255,255,255,.15);border-radius:28px;background:rgba(255,255,255,.06)}.av39q-command aside{padding:22px}. av39q-command h1{font-size:34px;line-height:1.04;margin:0}. av39q-command p{color:#d8b4fe;line-height:1.7}.av39q-metric{border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px;margin-top:12px}. av39q-metric b{font-size:26px}. av39q-metric span{display:block}. av39q-metric i{display:block;width:var(--w);height:8px;border-radius:99px;background:#7c3aed;margin-top:9px}.av39q-command main{padding:18px;font-family:ui-monospace,Menlo,monospace;color:#a7f3d0;line-height:1.8;overflow:hidden}.radar{position:relative;overflow:hidden;background-image:repeating-radial-gradient(circle at center,transparent 0 55px,rgba(255,255,255,.15) 56px 58px)}.radar:after{content:"";position:absolute;left:50%;top:50%;width:2px;height:50%;background:#7c3aed;transform-origin:0 0;animation:av39qscan 4s linear infinite}.radar i{position:absolute;left:var(--x);top:var(--y);width:16px;height:16px;border-radius:50%;background:#d8b4fe;box-shadow:0 0 0 8px #d8b4fe33}@keyframes av39qscan{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<section class="av39q-command">
            <aside><h1>CRM 세그먼트 AX Console</h1><p>CRM 세그먼트 자동 생성 실시간 처리 로그</p>
        <article class="av39q-metric">
            <span>이상치</span>
            <b data-meter>80%</b>
            <i style="--w:93%"></i>
        </article>
        <article class="av39q-metric">
            <span>우선순위</span>
            <b data-meter>91%</b>
            <i style="--w:66%"></i>
        </article>
        <article class="av39q-metric">
            <span>자동 처리율</span>
            <b data-meter>73%</b>
            <i style="--w:79%"></i>
        </article>
        <article class="av39q-metric">
            <span>검수 필요</span>
            <b data-meter>84%</b>
            <i style="--w:92%"></i>
        </article></aside>
            <main id="av39q-stream"></main>
            <div class="radar"><i style="--x:57%;--y:55%"></i><i style="--x:18%;--y:22%"></i><i style="--x:41%;--y:53%"></i><i style="--x:64%;--y:20%"></i><i style="--x:25%;--y:51%"></i><i style="--x:48%;--y:18%"></i><i style="--x:71%;--y:49%"></i><i style="--x:32%;--y:16%"></i><i style="--x:55%;--y:47%"></i></div>
        </section>
<script>
const av39qs=document.getElementById("av39q-stream");const av39qlogs=["자동 실행 queued","이상치 threshold crossed","owner=브랜드 운영팀","sla.check passed","handoff ticket 39-A"];let av39qn=0;setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+av39qlogs[av39qn++%av39qlogs.length];av39qs.prepend(p);while(av39qs.children.length>26)av39qs.lastElementChild.remove();},430);
const av39qmeters=[...document.querySelectorAll("[data-meter]")];
let av39qtick=0;
setInterval(()=>{
  av39qtick++;
  av39qmeters.forEach((el,i)=>el.textContent=(62+((av39qtick*3+i*9+39)%34))+"%");
},1100);
</script>
</body>
</html>
