<!DOCTYPE html>

<style>
*{box-sizing:border-box}

body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#fff1f4;color:#2a1721}.av15l-nodes{height:100vh;padding:24px;display:grid;grid-template-rows:90px 1fr;gap:18px}.av15l-nodes header{display:flex;align-items:center;gap:18px;border-radius:28px;background:#2a1721;color:#ffffff;padding:0 24px}.av15l-nodes h1{font-size:30px;margin:0}.av15l-nodes code{margin-left:auto;background:#ffffff;color:#2a1721;border-radius:14px;padding:12px 14px}.av15l-nodes section{display:grid;grid-template-columns:1fr 290px;gap:18px}.av15l-nodes svg,.av15l-nodes aside{border:2px solid #2a1721;border-radius:28px;background:#ffffff;box-shadow:8px 8px 0 #2a1721}.av15l-nodes path{fill:none;stroke:#ffc4d1;stroke-width:5;stroke-dasharray:12 10}. av15l-nodes rect{fill:#fff1f4;stroke:#2a1721;stroke-width:3}. av15l-nodes text{text-anchor:middle;dominant-baseline:middle;font-size:13px;font-weight:950;fill:#2a1721}.av15l-nodes aside{padding:18px;display:grid;gap:14px;align-content:start}.av15l-metric{border:1px solid #ffc4d1;border-radius:18px;padding:14px}.av15l-metric b{font-size:26px}. av15l-metric span{display:block;font-size:12px}. av15l-metric i{display:block;width:var(--w);height:8px;background:#e11d48;border-radius:99px;margin-top:9px}

<main class="av15l-nodes">

<script>

const av15lmeters=[...document.querySelectorAll("[data-meter]")];
let av15ltick=0;
setInterval(()=>{
  av15ltick++;
  av15lmeters.forEach((el,i)=>el.textContent=(62+((av15ltick*3+i*9+15)%34))+"%");
},1100);
</script>
