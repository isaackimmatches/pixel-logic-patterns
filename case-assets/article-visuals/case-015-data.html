<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-15-data | 경쟁사 상품 속성 수집</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#f5f3ff;color:#211a36}.av15d-ledger{height:100vh;display:grid;grid-template-columns:310px 1fr 320px;gap:20px;padding:24px}.left,.middle,.right{border:2px solid #211a36;border-radius:28px;background:#ffffff;box-shadow:8px 8px 0 #211a36}.left,.right{padding:24px}.left h1{font-size:36px;line-height:1.04;margin:0}.left p{color:#7c3aed;font-weight:950}.left div{border-top:1px solid #d8b4fe;padding:16px 0}.left b{display:block}.left span{color:#211a36;opacity:.65}.middle{display:grid;grid-template-columns:repeat(7,1fr);align-items:end;gap:10px;padding:22px;background:linear-gradient(180deg,#ffffff,#f5f3ff)}.middle i{height:var(--h);border-radius:14px 14px 4px 4px;background:#d8b4fe;border:1px solid #211a3644}.middle i.hot{background:#7c3aed;box-shadow:0 0 0 6px #d8b4fe}.right h2{font-size:30px;margin:0 0 18px}.av15d-metric{border:1px solid #d8b4fe;border-radius:18px;padding:14px;margin-bottom:12px}.av15d-metric span{display:block;font-size:12px}.av15d-metric b{font-size:28px}.av15d-metric i{display:block;width:var(--w);height:8px;border-radius:99px;background:#7c3aed;margin-top:9px}
</style>
</head>
<body>
<main class="av15d-ledger">
        <section class="left"><h1>경쟁사 상품 AX Console</h1><p>경쟁사 상품 속성 수집 원천 데이터 스냅샷</p><div><b>상품 DB</b><span>SKU key-150</span></div><div><b>주문 로그</b><span>주문 key-151</span></div><div><b>리뷰 텍스트</b><span>리뷰 key-152</span></div><div><b>재고 원장</b><span>매장 key-153</span></div></section>
        <section class="middle"><i class="" style="--h:39px"></i><i class="" style="--h:56px"></i><i class="" style="--h:73px"></i><i class="" style="--h:90px"></i><i class="" style="--h:107px"></i><i class="" style="--h:124px"></i><i class="hot" style="--h:141px"></i><i class="" style="--h:38px"></i><i class="" style="--h:55px"></i><i class="" style="--h:72px"></i><i class="" style="--h:89px"></i><i class="" style="--h:106px"></i><i class="" style="--h:123px"></i><i class="" style="--h:140px"></i><i class="" style="--h:37px"></i><i class="hot" style="--h:54px"></i><i class="" style="--h:71px"></i><i class="" style="--h:88px"></i><i class="" style="--h:105px"></i><i class="" style="--h:122px"></i><i class="" style="--h:139px"></i><i class="" style="--h:36px"></i><i class="" style="--h:53px"></i><i class="" style="--h:70px"></i><i class="hot" style="--h:87px"></i><i class="" style="--h:104px"></i><i class="" style="--h:121px"></i><i class="" style="--h:138px"></i><i class="" style="--h:35px"></i><i class="" style="--h:52px"></i><i class="" style="--h:69px"></i><i class="" style="--h:86px"></i><i class="" style="--h:103px"></i><i class="hot" style="--h:120px"></i><i class="" style="--h:137px"></i><i class="" style="--h:34px"></i><i class="" style="--h:51px"></i><i class="" style="--h:68px"></i><i class="" style="--h:85px"></i><i class="" style="--h:102px"></i><i class="" style="--h:119px"></i><i class="" style="--h:136px"></i></section>
        <section class="right"><h2>Merit CRM</h2>
        <article class="av15d-metric">
            <span>이상치</span>
            <b data-meter>86%</b>
            <i style="--w:69%"></i>
        </article>
        <article class="av15d-metric">
            <span>우선순위</span>
            <b data-meter>68%</b>
            <i style="--w:82%"></i>
        </article>
        <article class="av15d-metric">
            <span>자동 처리율</span>
            <b data-meter>79%</b>
            <i style="--w:55%"></i>
        </article>
        <article class="av15d-metric">
            <span>검수 필요</span>
            <b data-meter>90%</b>
            <i style="--w:68%"></i>
        </article></section>
    </main>
<script>

const av15dmeters=[...document.querySelectorAll("[data-meter]")];
let av15dtick=0;
setInterval(()=>{
  av15dtick++;
  av15dmeters.forEach((el,i)=>el.textContent=(62+((av15dtick*3+i*9+15)%34))+"%");
},1100);
</script>
</body>
</html>
