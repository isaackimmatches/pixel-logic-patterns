<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-37-logic | 랜딩페이지 A/B 실험</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#f8fafc;color:#0f172a}.av37l-compiler{height:100vh;display:grid;grid-template-columns:360px 1fr 300px;gap:18px;padding:22px}.editor,.preview,.weights{border:2px solid #0f172a;border-radius:28px;background:#ffffff;box-shadow:8px 8px 0 #0f172a}.editor{padding:24px}.editor h1{font-size:32px;line-height:1.04;margin:0 0 18px}.editor p{border:1px solid #bae6fd;border-radius:16px;padding:14px}.editor b{display:block;color:#0ea5e9}.editor span{display:block}.preview{display:grid;place-items:center;overflow:hidden}.preview canvas{width:100%;height:100%}.weights{padding:20px}.weights label{display:block;margin-bottom:28px;font-weight:950}.weights input{display:block;width:100%;accent-color:#0ea5e9;margin-top:12px}
</style>
</head>
<body>
<main class="av37l-compiler">
            <section class="editor"><h1>랜딩페이지 A/B AX Console Rule Compiler</h1><p><b>rule.1</b><span>when 이상치 then 자동 실행</span></p><p><b>rule.2</b><span>when 우선순위 then 담당자 검수</span></p><p><b>rule.3</b><span>when 자동 처리율 then 승인 요청</span></p><p><b>rule.4</b><span>when 검수 필요 then 리포트 발행</span></p></section>
            <section class="preview"><canvas id="av37l-canvas" width="780" height="560"></canvas></section>
            <section class="weights"><label>광고 API<input type="range" value="82" disabled></label><label>CRM 이벤트<input type="range" value="49" disabled></label><label>콘텐츠 메타<input type="range" value="66" disabled></label><label>검색 로그<input type="range" value="83" disabled></label></section>
        </main>
<script>
const c=document.getElementById("av37l-canvas"),ctx=c.getContext("2d");let t=0;function draw(){t+=.03;ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle="#f8fafc";ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<10;i++){ctx.beginPath();ctx.arc(90+i*70,290+Math.sin(t+i)*130,26+i%3*7,0,Math.PI*2);ctx.fillStyle=i%2?"#bae6fd":"#0ea5e9";ctx.fill();ctx.strokeStyle="#0f172a";ctx.lineWidth=4;ctx.stroke();}ctx.fillStyle="#0f172a";ctx.font="800 34px Inter";ctx.fillText("캠페인 decision surface",42,68);requestAnimationFrame(draw)}draw();
</script>
</body>
</html>
