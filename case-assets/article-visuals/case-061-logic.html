<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-61-logic | 생산일보 자동화</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#fff7ed;color:#1f2937}.av61l-compiler{height:100vh;display:grid;grid-template-columns:360px 1fr 300px;gap:18px;padding:22px}.editor,.preview,.weights{border:2px solid #1f2937;border-radius:28px;background:#ffffff;box-shadow:8px 8px 0 #1f2937}.editor{padding:24px}.editor h1{font-size:32px;line-height:1.04;margin:0 0 18px}.editor p{border:1px solid #ffd3b6;border-radius:16px;padding:14px}.editor b{display:block;color:#f97316}.editor span{display:block}.preview{display:grid;place-items:center;overflow:hidden}.preview canvas{width:100%;height:100%}.weights{padding:20px}.weights label{display:block;margin-bottom:28px;font-weight:950}.weights input{display:block;width:100%;accent-color:#f97316;margin-top:12px}
</style>
</head>
<body>
<main class="av61l-compiler">
            <section class="editor"><h1>Factory Signal Monitor Rule Compiler</h1><p><b>rule.1</b><span>when 설비 편차 then 작업지시 추천</span></p><p><b>rule.2</b><span>when 불량 픽셀 then 정비 티켓</span></p><p><b>rule.3</b><span>when 라인 병목 then 라인 정지 알림</span></p><p><b>rule.4</b><span>when 정비 우선순위 then 품질 리포트</span></p></section>
            <section class="preview"><canvas id="av61l-canvas" width="780" height="560"></canvas></section>
            <section class="weights"><label>MES 로그<input type="range" value="56" disabled></label><label>센서 스트림<input type="range" value="73" disabled></label><label>검사 이미지<input type="range" value="90" disabled></label><label>작업지시서<input type="range" value="57" disabled></label></section>
        </main>
<script>
const c=document.getElementById("av61l-canvas"),ctx=c.getContext("2d");let t=0;function draw(){t+=.03;ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle="#fff7ed";ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<10;i++){ctx.beginPath();ctx.arc(90+i*70,290+Math.sin(t+i)*130,26+i%3*7,0,Math.PI*2);ctx.fillStyle=i%2?"#ffd3b6":"#f97316";ctx.fill();ctx.strokeStyle="#1f2937";ctx.lineWidth=4;ctx.stroke();}ctx.fillStyle="#1f2937";ctx.font="800 34px Inter";ctx.fillText("라인 decision surface",42,68);requestAnimationFrame(draw)}draw();
</script>
</body>
</html>
