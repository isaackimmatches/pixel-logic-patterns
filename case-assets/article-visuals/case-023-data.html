<script>

const av23dmeters=[...document.querySelectorAll("[data-meter]")];
let av23dtick=0;
setInterval(()=>{
  av23dtick++;
  av23dmeters.forEach((el,i)=>el.textContent=(62+((av23dtick*3+i*9+23)%34))+"%");
},1100);
