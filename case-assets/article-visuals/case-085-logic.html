<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-85-logic | 회계 증빙 검수</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#fff1f4;color:#2a1721}.av85l-compiler{height:100vh;display:grid;grid-template-columns:360px 1fr 300px;gap:18px;padding:22px}.editor,.preview,.weights{border:2px solid #2a1721;border-radius:28px;background:#ffffff;box-shadow:8px 8px 0 #2a1721}.editor{padding:24px}.editor h1{font-size:32px;line-height:1.04;margin:0 0 18px}.editor p{border:1px solid #ffc4d1;border-radius:16px;padding:14px}.editor b{display:block;color:#e11d48}.editor span{display:block}.preview{display:grid;place-items:center;overflow:hidden}.preview canvas{width:100%;height:100%}.weights{padding:20px}.weights label{display:block;margin-bottom:28px;font-weight:950}.weights input{display:block;width:100%;accent-color:#e11d48;margin-top:12px}
</style>
</head>
<body>
<main class="av85l-compiler">
            <section class="editor"><h1>Document Risk Workbench Rule Compiler</h1><p><b>rule.1</b><span>when 핵심 조항 then 조항 추출</span></p><p><b>rule.2</b><span>when 금액 불일치 then 검토자 지정</span></p><p><b>rule.3</b><span>when 권한 예외 then 반려 사유 생성</span></p><p><b>rule.4</b><span>when 검토 위험도 then 승인 큐 등록</span></p></section>
            <section class="preview"><canvas id="av85l-canvas" width="780" height="560"></canvas></section>
            <section class="weights"><label>PDF 원본<input type="range" value="80" disabled></label><label>거래처 원장<input type="range" value="47" disabled></label><label>승인 이력<input type="range" value="64" disabled></label><label>표준 조항집<input type="range" value="81" disabled></label></section>
        </main>
<script>
const c=document.getElementById("av85l-canvas"),ctx=c.getContext("2d");let t=0;function draw(){t+=.03;ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle="#fff1f4";ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<10;i++){ctx.beginPath();ctx.arc(90+i*70,290+Math.sin(t+i)*130,26+i%3*7,0,Math.PI*2);ctx.fillStyle=i%2?"#ffc4d1":"#e11d48";ctx.fill();ctx.strokeStyle="#2a1721";ctx.lineWidth=4;ctx.stroke();}ctx.fillStyle="#2a1721";ctx.font="800 34px Inter";ctx.fillText("문서 decision surface",42,68);requestAnimationFrame(draw)}draw();
</script>
</body>
</html>
