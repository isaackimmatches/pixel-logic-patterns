<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>article-scene-55-queue | 콘텐츠 재활용 파이프라인</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Inter,"Wanted Sans Variable","Pretendard",system-ui,sans-serif}
body{background:#2a1721;color:#ffffff}.av55q-command{height:100vh;display:grid;grid-template-columns:320px 1fr 420px;gap:18px;padding:22px;background:radial-gradient(circle at 76% 30%,#e11d4855,transparent 34%),#2a1721}.av55q-command aside,.av55q-command main,.radar{border:1px solid rgba(255,255,255,.15);border-radius:28px;background:rgba(255,255,255,.06)}.av55q-command aside{padding:22px}. av55q-command h1{font-size:34px;line-height:1.04;margin:0}. av55q-command p{color:#ffc4d1;line-height:1.7}.av55q-metric{border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:14px;margin-top:12px}. av55q-metric b{font-size:26px}. av55q-metric span{display:block}. av55q-metric i{display:block;width:var(--w);height:8px;border-radius:99px;background:#e11d48;margin-top:9px}.av55q-command main{padding:18px;font-family:ui-monospace,Menlo,monospace;color:#a7f3d0;line-height:1.8;overflow:hidden}.radar{position:relative;overflow:hidden;background-image:repeating-radial-gradient(circle at center,transparent 0 55px,rgba(255,255,255,.15) 56px 58px)}.radar:after{content:"";position:absolute;left:50%;top:50%;width:2px;height:50%;background:#e11d48;transform-origin:0 0;animation:av55qscan 4s linear infinite}.radar i{position:absolute;left:var(--x);top:var(--y);width:16px;height:16px;border-radius:50%;background:#ffc4d1;box-shadow:0 0 0 8px #ffc4d133}@keyframes av55qscan{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<section class="av55q-command">
            <aside><h1>콘텐츠 재활용 AX Console</h1><p>콘텐츠 재활용 파이프라인 실시간 처리 로그</p>
        <article class="av55q-metric">
            <span>이상치</span>
            <b data-meter>76%</b>
            <i style="--w:69%"></i>
        </article>
        <article class="av55q-metric">
            <span>우선순위</span>
            <b data-meter>87%</b>
            <i style="--w:82%"></i>
        </article>
        <article class="av55q-metric">
            <span>자동 처리율</span>
            <b data-meter>69%</b>
            <i style="--w:55%"></i>
        </article>
        <article class="av55q-metric">
            <span>검수 필요</span>
            <b data-meter>80%</b>
            <i style="--w:68%"></i>
        </article></aside>
            <main id="av55q-stream"></main>
            <div class="radar"><i style="--x:73%;--y:71%"></i><i style="--x:34%;--y:38%"></i><i style="--x:57%;--y:69%"></i><i style="--x:18%;--y:36%"></i><i style="--x:41%;--y:67%"></i><i style="--x:64%;--y:34%"></i><i style="--x:25%;--y:65%"></i><i style="--x:48%;--y:32%"></i><i style="--x:71%;--y:63%"></i></div>
        </section>
<script>
const av55qs=document.getElementById("av55q-stream");const av55qlogs=["자동 실행 queued","이상치 threshold crossed","owner=브랜드 운영팀","sla.check passed","handoff ticket 55-A"];let av55qn=0;setInterval(()=>{const p=document.createElement("p");p.textContent="["+new Date().toLocaleTimeString("ko-KR",{hour12:false})+"] "+av55qlogs[av55qn++%av55qlogs.length];av55qs.prepend(p);while(av55qs.children.length>26)av55qs.lastElementChild.remove();},430);
const av55qmeters=[...document.querySelectorAll("[data-meter]")];
let av55qtick=0;
setInterval(()=>{
  av55qtick++;
  av55qmeters.forEach((el,i)=>el.textContent=(62+((av55qtick*3+i*9+55)%34))+"%");
},1100);
</script>
</body>
</html>
